<svg aria-labelledby="bvlp-unit-4a-u4a-p-series-threshold-title bvlp-unit-4a-u4a-p-series-threshold-description" class="bvlp-svg" data-bvlp-scene="unit-4a-u4a-p-series-threshold" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4a-u4a-p-series-threshold-title">The p-series threshold occurs at p equals 1</title><desc id="bvlp-unit-4a-u4a-p-series-threshold-description">Three partial-sum curves show rapid growth for p=1/2, slow unbounded growth for p=1, and leveling for p=2. Partial sums for p=1/2, p=1, and p=2 on matched axes. Preserve the misconception control described in the lesson and storyboard. Three partial-sum curves show rapid growth for p=1/2, slow unbounded growth for p=1, and leveling for p=2. Partial sums for p=1/2, p=1, and p=2 on matched axes. Preserve the misconception control described in the lesson and storyboard. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in the p-series threshold occurs at p equals 1; color is never the only cue. Caption: The p-series threshold occurs at p equals 1. Partial sums for p=1/2, p=1, and p=2 on matched axes. Reading order: p-axis: Parameter axis for p.; threshold: Threshold p equals 1.; divergent-zone: For p at most 1, the positive p-series diverges.; convergent-zone: For p greater than 1, the p-series converges.; selected-p: Selected p moves across the threshold.; diverges: Label: p &lt;= 1: diverges.; converges: Label: p &gt; 1: converges.; p-control: Exponent p.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-s