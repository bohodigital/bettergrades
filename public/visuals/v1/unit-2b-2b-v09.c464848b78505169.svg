<svg aria-labelledby="bvlp-unit-2b-2b-v09-title bvlp-unit-2b-2b-v09-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v09" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v09-title">Sliding ladder geometry</title><desc id="bvlp-unit-2b-2b-v09-description">The wall, ground, and ladder form a right triangle. The fixed ladder length gives x 2+y 2=L 2 , while dx/dt and dy/dt describe the horizontal and vertical endpoint speeds. As the foot moves away from the wall, x increases. Because the ladder length stays fixed, the top must move downward, so y decreases. Differentiating x 2+y 2=L 2 gives 2x dx/dt+2y dy/dt=0 , which already predicts opposite signs. As the foot moves away from the wall, x increases. Because the ladder length stays fixed, the top must move downward, so y decreases. Differentiating x 2+y 2=L 2 gives 2x\,dx/dt+2y\,dy/dt=0, which already predicts opposite signs. The wall, ground, and ladder form a right triangle. The fixed ladder length gives x 2+y 2=L 2 , while dx/dt and dy/dt describe the horizontal and vertical endpoint speeds. As the foot moves away from the wall, x increases. Because the ladder length stays fixed, the top must move downward, so y decreases. Differentiating x 2+y 2=L 2 gives 2x dx/dt+2y dy/dt=0 , which already predicts opposite signs. Every relationship in sliding ladder geometry is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: The wall, ground, and ladder form a right triangle. The fixed ladder length gives x 2+y 2=L 2, while dx/dt and dy/dt describe the horizontal and vertical endpoint speeds. Reading order: wall: vertical wall; solid segment.; ground: level ground; solid segment.; ladder: fixed ladder L=10; double segment.; top: Filled circle marks ladder top y=6.; foot: Filled diamond marks ladder foot x=8.; dx: foot moves right: dx/dt &gt; 0; dy: top moves down: dy/dt &lt; 0; constraint: Label: x^2 + y^2 = L^2.; rates: Label: 2x dx/dt + 2y dy/dt = 0.; foot-control: Move the ladder foot along the ground.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v09-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v09-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v09-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v09-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2b-2b-v09-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2b-2b-v09-panel-default-title bvlp-unit-2b-2b-v09-panel-d