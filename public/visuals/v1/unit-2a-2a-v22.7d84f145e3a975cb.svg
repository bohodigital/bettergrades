<svg aria-labelledby="bvlp-unit-2a-2a-v22-title bvlp-unit-2a-2a-v22-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v22" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v22-title">The nonlinear remainder shrinks faster than the input step</title><desc id="bvlp-unit-2a-2a-v22-description">For f(x)=x 2 at a=3 , the exact change is 6h+h 2 . The tangent model keeps 6h ; the discarded remainder h 2 becomes small not only in absolute size, but also relative to h . Near h=0 , the gold curve falls toward zero much faster than the blue V-shaped graph. Dividing the remainder by the step gives h 2/|h|=|h| , which also approaches zero. That relative comparison, rather than the mere fact that both quantities are small, is what little- o notation records. For f(x)=x 2 at a=3 , the exact change is 6h+h 2 . The tangent model keeps 6h ; the discarded remainder h 2 becomes small not only in absolute size, but also relative to h . Near h=0 , the gold curve falls toward zero much faster than the blue V-shaped graph. Dividing the remainder by the step gives h 2/|h|=|h| , which also approaches zero. That relative comparison, rather than the mere fact that both quantities are small, is what little- o notation records. The visual uses labeled positions, solid and dashed line styles, and written descriptions so the nonlinear remainder shrinks faster than the input step does not depend on color. Caption: For f(x)=x 2 at a=3, the exact change is 6h+h 2. The tangent model keeps 6h; the discarded remainder h 2 becomes small not only in absolute size, but also relative to h. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; reading-note: A written reading cue names 