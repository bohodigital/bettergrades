<svg aria-labelledby="bvlp-precalculus-u10-l3-v1-title bvlp-precalculus-u10-l3-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u10-l3-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u10-l3-v1-title">Amplitude, reflection, and midline · Maximum-minimum-midline diagram</title><desc id="bvlp-precalculus-u10-l3-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Amplitude is a distance, so it is nonnegative. The midline is the average of the maximum and minimum, and amplitude is half their difference. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Amplitude is a distance, so it is nonnegative. The midline is the average of the maximum and minimum, and amplitude is half their difference. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Amplitude is a distance, so it is nonnegative. The midline is the average of the maximum and minimum, and amplitude is half their difference. The calculation and the representation should agree,