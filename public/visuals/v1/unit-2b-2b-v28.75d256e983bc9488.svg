<svg aria-labelledby="bvlp-unit-2b-2b-v28-title bvlp-unit-2b-2b-v28-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v28" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v28-title">Near a simple root, Newton&apos;s error is approximately squared each step</title><desc id="bvlp-unit-2b-2b-v28-description">For a well-chosen starting point, the number of correct digits can roughly double from one iteration to the next. The table visualizes this rapid error collapse for x 2-2=0 . The error does not merely shrink by a fixed percentage. Once the iterates are close to the simple root, an error around 10 -3 is followed by one around 10 -6 , then around 10 -12 . That is the practical signature of quadratic convergence. The error does not merely shrink by a fixed percentage. Once the iterates are close to the simple root, an error around 10 -3 is followed by one around 10 -6 , then around 10 -12 . That is the practical signature of quadratic convergence. For a well-chosen starting point, the number of correct digits can roughly double from one iteration to the next. The table visualizes this rapid error collapse for x 2-2=0 . The error does not merely shrink by a fixed percentage. Once the iterates are close to the simple root, an error around 10 -3 is followed by one around 10 -6 , then around 10 -12 . That is the practical signature of quadratic convergence. Every relationship in near a simple root, newton&apos;s error is approximately squared each step is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: For a well-chosen starting point, the number of correct digits can roughly double from one iteration to the next. The table visualizes this rapid erro