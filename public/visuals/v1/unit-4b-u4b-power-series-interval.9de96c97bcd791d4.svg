nce is automatic; outside, divergence is automatic; each endpoint must be checked separately. A number line with an absolute-convergence interior, undecided endpoints, and divergence exterior.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="436" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><g clip-path="url(#bvlp-unit-4b-u4b-power-series-interval-panel-default-clip)"><g aria-label="Expansion center." data-layer-id="center" data-layer-kind="closed-point" data-line-style="solid" role="group"><polygon fill="#67e8f9" points="499,300.6 506,307.6 499,314.6 492,307.6" stroke="#155e75" stroke-width="2.25" vector-effect="non-scaling-stroke"/></g><g aria-label="Label: c." data-layer-id="center-label" data-layer-kind="label" data-line-style="solid" role="group"><text class="bvlp-annotation" data-bvlp-label-box="487,197.607,24,16.52" fill="#111827" font-size="14" font-weight="650" text-anchor="middle" x="499" y="211.607"><tspan dy="0" x="499">c</tspan></text></g><g aria-label="Centered open interval from c minus R to c plus R." data-layer-id="interval" data-layer-kind="polygon" data-line-style="solid" role="group"><polygon fill="url(#bvlp-unit-4b-u4b-power-series-interval-pattern-dots)" fill-opacity="0.38" points="291.5,358.467 706.5,358.467 706.5,256.733 291.5,256.733" stroke="#15803d" stroke-width="2" vector-effect="non-scaling-stroke"/></g><g aria-label="Left boundary awaits testing." data-layer-id="left" data-layer-kind="open-point" data-line-style="solid" role="group"><circle cx="291.5" cy="307.6" fill="#ffffff" r="6.5" stroke="#b45309" stroke-width="3" vector-effect="non-scaling-stroke"/></g><g aria-label="Label: c-R." data-layer-id="left-label" data-layer-kind="label" data-line-style="solid" role="group"><text class="bvlp-annotation" data-bvlp-label-box="277.61,197.607,27.78,16.52" fill="#111827" font-size="14" font-weight="650" text-anchor="middle" x="291.5" y="211.607"><tspan dy="0" x="291.5">c-R</tspan></text></g><g aria-label="Real line throu