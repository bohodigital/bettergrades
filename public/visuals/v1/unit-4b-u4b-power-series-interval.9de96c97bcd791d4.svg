<svg aria-labelledby="bvlp-unit-4b-u4b-power-series-interval-title bvlp-unit-4b-u4b-power-series-interval-description" class="bvlp-svg" data-bvlp-scene="unit-4b-u4b-power-series-interval" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4b-u4b-power-series-interval-title">A power series converges on an interval centered at its expansion point</title><desc id="bvlp-unit-4b-u4b-power-series-interval-description">Inside the radius R, convergence is automatic; outside, divergence is automatic; each endpoint must be checked separately. A number line with an absolute-convergence interior, undecided endpoints, and divergence exterior. Inside the radius R, convergence is automatic; outside, divergence is automatic; each endpoint must be checked separately. A number line with an absolute-convergence interior, undecided endpoints, and divergence exterior. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in a power series converges on an interval centered at its expansion point; color is never the only cue. Caption: A power series converges on an interval centered at its expansion point. A number line with an absolute-convergence interior, undecided endpoints, and divergence exterior. Reading order: line: Real line through the convergence interval.; interval: Centered open interval from c minus R to c plus R.; left: Left boundary awaits testing.; center: Expansion center.; right: Right boundary awaits testing.; left-label: Label: c-R.; center-label: Label: c.; right-label: Label: c+R.; symmetry-note: Annotation: The radius is symmetric; endpoint inclusion need not be...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-