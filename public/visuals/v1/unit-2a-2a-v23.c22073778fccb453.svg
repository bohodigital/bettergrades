<svg aria-labelledby="bvlp-unit-2a-2a-v23-title bvlp-unit-2a-2a-v23-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v23" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v23-title">A derivative may be rough, but it cannot jump over slope values</title><desc id="bvlp-unit-2a-2a-v23-description">The left panel shows a step-shaped candidate with a genuine jump; Darboux&apos;s Theorem rules it out as the derivative of any everywhere-differentiable function on that interval. The right panel crosses every intermediate height. The left graph goes from slope -1 to slope 1 without ever taking slope 0 . A derivative cannot do that. It may oscillate or fail to be continuous in subtler ways, but whenever it takes two slope values it must take every value between them somewhere in between. The left panel shows a step-shaped candidate with a genuine jump; Darboux&apos;s Theorem rules it out as the derivative of any everywhere-differentiable function on that interval. The right panel crosses every intermediate height. The left graph goes from slope -1 to slope 1 without ever taking slope 0 . A derivative cannot do that. It may oscillate or fail to be continuous in subtler ways, but whenever it takes two slope values it must take every value between them somewhere in between. The visual uses labeled positions, solid and dashed line styles, and written descriptions so a derivative may be rough, but it cannot jump over slope values does not depend on color. Caption: The left panel shows a step-shaped candidate with a genuine jump; Darboux&apos;s Theorem rules it out as the derivative of any everywhere-differentiable function on that interval. The right panel crosses every intermediate height. Reading order: relationship-1: solid curve 1 is distinguished by line sty