<svg aria-labelledby="bvlp-unit-2b-2b-v17-title bvlp-unit-2b-2b-v17-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v17" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v17-title">Complete curve analysis layers many facts onto one graph</title><desc id="bvlp-unit-2b-2b-v17-description">Domain, intercepts, asymptotes, critical points, monotonicity, concavity, and end behavior are not separate chores. Together they explain why the graph has its shape. The graph of x/(x 2+1) has no vertical asymptotes, crosses the origin, approaches zero at both ends, and has extrema at x= 1 . Derivative signs explain where it rises and falls; second-derivative signs explain the changes in bending. Each annotation answers part of one coherent shape question. The graph of x/(x 2+1) has no vertical asymptotes, crosses the origin, approaches zero at both ends, and has extrema at x= 1. Derivative signs explain where it rises and falls; second-derivative signs explain the changes in bending. Each annotation answers part of one coherent shape question. Domain, intercepts, asymptotes, critical points, monotonicity, concavity, and end behavior are not separate chores. Together they explain why the graph has its shape. The graph of x/(x 2+1) has no vertical asymptotes, crosses the origin, approaches zero at both ends, and has extrema at x= 1 . Derivative signs explain where it rises and falls; second-derivative signs explain the changes in bending. Each annotation answers part of one coherent shape question. Every relationship in complete curve analysis layers many facts onto one graph is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Domain, intercepts, asymptotes, critical points, monotonicity, concavity, and end behavior are not separate chores. Together they explain why the graph has its shape. Reading order: curve: f(x)=x/(x^2+1); solid line.; horizontal-asymptote: horizontal asymptote y=0; dashed segment.; minimum: Filled diamond marks local minimum (-1,-1/2).; intercept: Filled circle marks intercept and symmetry center.; maximum: Filled diamond marks local maximum (1,1/2).; inflection-left: Open circle marks inflection near -sqrt(3).; inflection-right: Open circle marks inflection near sqrt(3).; story: Annotation: Signs of f&apos; and f&apos;&apos; justify every turn and bend...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v17-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v17-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v17-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v17-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto