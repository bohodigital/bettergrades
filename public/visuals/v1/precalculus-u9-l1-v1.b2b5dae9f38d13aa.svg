<svg aria-labelledby="bvlp-precalculus-u9-l1-v1-title bvlp-precalculus-u9-l1-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u9-l1-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u9-l1-v1-title">Directed rotation and coterminal angles · Directed-angle animation with positive and negative arrows</title><desc id="bvlp-precalculus-u9-l1-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: To reduce an angle, add or subtract complete revolutions until the value lies in the desired interval. The operation changes the accumulated rotation but preserves the terminal side because every full revolution returns the ray to its prior direction. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: To reduce an angle, add or subtract complete revolutions until the value lies in the desired interval. The operation changes the accumulated rotation but preserves the terminal side because every full revolution returns the ray to its prior direction. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify t