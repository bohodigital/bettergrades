<svg aria-labelledby="bvlp-unit-2b-2b-v02-title bvlp-unit-2b-2b-v02-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v02" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v02-title">Position, velocity, and acceleration are three synchronized views of motion</title><desc id="bvlp-unit-2b-2b-v02-description">Position tells where the object is. Velocity tells how position changes. Acceleration tells how velocity changes. Aligning the graphs by time makes changes of direction and speeding behavior visible. Follow one time vertically through all three panels. Zeros of velocity correspond to horizontal tangents and possible direction changes in position. The sign of velocity tells direction. The sign of acceleration tells whether velocity is moving upward or downward, but speeding up depends on the signs of both velocity and acceleration. Follow one time vertically through all three panels. Zeros of velocity correspond to horizontal tangents and possible direction changes in position. The sign of velocity tells direction. The sign of acceleration tells whether velocity is moving upward or downward, but speeding up depends on the signs of both velocity and acceleration. Position tells where the object is. Velocity tells how position changes. Acceleration tells how velocity changes. Aligning the graphs by time makes changes of direction and speeding behavior visible. Follow one time vertically through all three panels. Zeros of velocity correspond to horizontal tangents and possible direction changes in position. The sign of velocity tells direction. The sign of acceleration tells whether velocity is moving upward or downward, but speeding up depends on the signs of both velocity and acceleration. Every relationship in position, velocity, and acceleration are three synchronized views of motion is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Position tells where the object is. Velocity tells how position changes. Acceleration tells how velocity changes. Aligning the graphs by time makes changes of direction and speeding behavior visible. Reading order: position: position s(t), top band; solid line.; velocity: velocity v(t), middle band; dashed line.; acceleration: acceleration a(t), lower band; dotted line.; time-guide: One time read vertically through all three views; dashed segment.; position-label: Label: position.; velocity-label: Label: velocity.; acceleration-label: Label: acceleration..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v02-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v02-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v02-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r