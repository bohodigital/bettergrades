<svg aria-labelledby="bvlp-unit-2b-2b-v30-title bvlp-unit-2b-2b-v30-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v30" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v30-title">Cauchy&apos;s theorem matches a ratio of secant changes to a ratio of instantaneous rates</title><desc id="bvlp-unit-2b-2b-v30-description">For two functions on the same input interval, one interior point c makes [f(b)-f(a)]/[g(b)-g(a)]=f&apos;(c)/g&apos;(c) . The same c must be used in both derivative graphs. Both panels use the same input interval and the same interior point. For this example, the secant changes satisfy f/ g=8/2=4 , while the derivative ratio at c=2 is f&apos;(2)/g&apos;(2)=4/1=4 . The theorem compares two changing quantities rather than comparing either one directly with x . Both panels use the same input interval and the same interior point. For this example, the secant changes satisfy f/ g=8/2=4, while the derivative ratio at c=2 is f&apos;(2)/g&apos;(2)=4/1=4. The theorem compares two changing quantities rather than comparing either one directly with x. For two functions on the same input interval, one interior point c makes [f(b)-f(a)]/[g(b)-g(a)]=f&apos;(c)/g&apos;(c) . The same c must be used in both derivative graphs. Both panels use the same input interval and the same interior point. For this example, the secant changes satisfy f/ g=8/2=4 , while the derivative ratio at c=2 is f&apos;(2)/g&apos;(2)=4/1=4 . The theorem compares two changing quantities rather than comparing either one directly with x . Every relationship in cauchy&apos;s theorem matches a ratio of secant changes to a ratio of instantaneous rates is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: For two functions on the same input interval, one interior point c makes [f(b)-f(a)]/[g(b)-g(a)]=f&apos;(c)/g&apos;(c). The same c must be used in both derivative graphs. Reading order: f: f(x)=x^2; solid line.; g: g(x)=x+6; dashed line.; f-secant: f secant: Δf=8; dotted segment.; g-secant: g secant: Δg=2; dotted segment.; common-c-f: Filled diamond marks c=2 on f.; common-c-g: Filled diamond marks c=2 on g.; ratio: Annotation: 8/2 = f&apos;(2)/g&apos;(2) = 4...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v30-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v30-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v30-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v30-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-