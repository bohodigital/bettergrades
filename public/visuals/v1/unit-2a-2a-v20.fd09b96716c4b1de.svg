<svg aria-labelledby="bvlp-unit-2a-2a-v20-title bvlp-unit-2a-2a-v20-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v20" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v20-title">A function, its first derivative, and its second derivative tell a layered story</title><desc id="bvlp-unit-2a-2a-v20-description">The height of f&apos; records the slope of f . The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Where f&apos; is positive, f rises; where f&apos; is negative, f falls. Where f&quot; is positive, the slopes shown by f&apos; are increasing and f is concave up; where f&quot; is negative, f is concave down. The zeros of the lower graphs mark transitions in the graphs above them. The height of f&apos; records the slope of f . The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Where f&apos; is positive, f rises; where f&apos; is negative, f falls. Where f&quot; is positive, the slopes shown by f&apos; are increasing and f is concave up; where f&quot; is negative, f is concave down. The zeros of the lower graphs mark transitions in the graphs above them. The visual uses labeled positions, solid and dashed line styles, and written descriptions so a function, its first derivative, and its second derivative tell a layered story does not depend on color. Caption: The height of f&apos; records the slope of f. The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; relationship-3: dotted curve 3 is distinguished by line style and label..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v20-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v20-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v20-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2a-2a-v20-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2a-2a-v20-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2a-2a-v20-panel-default-title bvlp-unit-2a-2a-v20-panel-default-desc" id="bvlp-unit-2a-2a-v20-panel-default" role="group"><title id="bvlp-unit-2a-2a-v20-panel-default-title">A function, its first derivative, and its second derivative tell a layered story</title><desc id="bvlp-unit-2a-