<svg aria-labelledby="bvlp-vertical-asymptotes-title bvlp-vertical-asymptotes-description" class="bvlp-svg" data-bvlp-scene="vertical-asymptotes" data-grayscale-safe="true" focusable="false" height="338" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 338" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-vertical-asymptotes-title">Odd and even powers at a vertical asymptote</title><desc id="bvlp-vertical-asymptotes-description">The odd power changes sign across the asymptote; the even power approaches positive infinity from both sides. Two ordered panels share the vertical asymptote x = 1. In the odd-power panel, y = 1/(x - 1) falls without bound from the left and rises without bound from the right. In the even-power panel, y = 1/(x - 1) squared rises without bound from both sides. Each panel uses explicit left and right domains and a dashed asymptote. The odd-power curves are solid, the even-power curves are double-stroked, and both panels mark x = 1 with a dashed line and title. Caption: An odd power changes sign across the vertical asymptote; an even power remains positive on both sides. Reading order: odd-power-panel: The signs differ across x = 1.; odd-left: Solid odd-power left branch stops before x = 1.; odd-right: Solid odd-power right branch starts after x = 1.; odd-asymptote: Dashed vertical asymptote x = 1.; even-power-panel: Both sides stay positive near x = 1.; even-left: Double-stroked even-power left branch stops before x = 1.; even-right: Double-stroked even-power right branch starts after x = 1.; even-asymptote: Dashed vertical asymptote x = 1..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-vertical-asymptotes-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-vertical-asymptotes-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-vertical-asymptotes-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-vertical-asymptotes-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-vertical-asymptotes-panel-odd-power-panel-clip"><rect height="182" width="366" x="84" y="80"/></clipPath><clipPath id="bvlp-vertical-asymptotes-panel-even-power-panel-clip"><rect height="182" width="366" x="548" y="80"/></clipPath></defs><g aria-labelledby="bvlp-vertical-asymptotes-panel-odd-power-panel-title bvlp-vertical-asymptotes-panel-odd-power-panel-desc" id="bvlp-vertical-asymptotes-panel-odd-power-panel" role="group"><title id="bvlp-vertical-asymptotes-panel-odd-power-panel-title">Odd power: 1/(x - 1)</title><desc id="bvlp-vertical-asymptotes-panel-odd-power-panel-desc">The signs differ across x = 1.</desc><text class="bvlp-panel-title" fill="#111827" font-size="15" font-weight="700" text-anchor="middle" x="248" y="48"><tspan dy="0" x="248">Odd power: 1/(x - 1)</tspan></te