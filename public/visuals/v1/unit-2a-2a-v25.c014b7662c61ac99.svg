<svg aria-labelledby="bvlp-unit-2a-2a-v25-title bvlp-unit-2a-2a-v25-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v25" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v25-title">An implicit curve can be a function locally even when it is not one globally</title><desc id="bvlp-unit-2a-2a-v25-description">Near (3,4) , a narrow vertical strip meets the circle in one upper-branch point for each nearby x , so y can be solved locally as a smooth function of x . Near (5,0) , the vertical tangent marks failure of that choice of output variable. The whole circle fails the vertical-line test, but locality changes the question. Around (3,4) , after choosing a small enough neighborhood and the upper branch, nearby x -values determine exactly one nearby y -value. At (5,0) , F y=2y=0 and the tangent is vertical, so solving smoothly for y as a function of x breaks down there. Near (3,4) , a narrow vertical strip meets the circle in one upper-branch point for each nearby x , so y can be solved locally as a smooth function of x . Near (5,0) , the vertical tangent marks failure of that choice of output variable. The whole circle fails the vertical-line test, but locality changes the question. Around (3,4) , after choosing a small enough neighborhood and the upper branch, nearby x -values determine exactly one nearby y -value. At (5,0) , F y=2y=0 and the tangent is vertical, so solving smoothly for y as a function of x breaks down there. The visual uses labeled positions, solid and dashed line styles, and written descriptions so an implicit curve can be a function locally even when it is not one globally does not depend on color. Caption: Near (3,4), a narrow vertical strip meets the circle in one upper-branch point for each nearby x, so y can be solved locally as a smooth function of x. Near (5,0), the vertical tangent marks failure of that choice of output variable. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; local-strip: Crosshatched neighborhood isolates the upper local branch.; good-local-point: Filled circle marks local graph near (3, 4).; failure-point: Filled diamond marks vertical tangent at (5, 0).; vertical-tangent: Dashed vertical line marks failure to solve locally for y as a function of x..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v25-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v25-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v25-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2a-2a-v25-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path