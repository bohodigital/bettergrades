<svg aria-labelledby="bvlp-unit-2a-2a-v13-title bvlp-unit-2a-2a-v13-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v13" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v13-title">The special base e has slope equal to height</title><desc id="bvlp-unit-2a-2a-v13-description">For y=e x , the tangent slope at every input equals the function value there. At x=0 , both the height and the slope are 1 . The tangent line at (0,1) has slope 1 , matching the exponential&apos;s height. At every other input, the same phenomenon persists: the derivative of e x is e x . This is why e is the natural base for continuous growth models and calculus. For y=e x , the tangent slope at every input equals the function value there. At x=0 , both the height and the slope are 1 . The tangent line at (0,1) has slope 1 , matching the exponential&apos;s height. At every other input, the same phenomenon persists: the derivative of e x is e x . This is why e is the natural base for continuous growth models and calculus. The visual uses labeled positions, solid and dashed line styles, and written descriptions so the special base e has slope equal to height does not depend on color. Caption: For y=e x, the tangent slope at every input equals the function value there. At x=0, both the height and the slope are 1. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; reading-note: A written reading cue names the visual&apos;s mathematical relationship..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#f