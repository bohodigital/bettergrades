<svg aria-labelledby="bvlp-horizontal-asymptote-title bvlp-horizontal-asymptote-description" class="bvlp-svg" data-bvlp-scene="horizontal-asymptote" data-grayscale-safe="true" focusable="false" height="519" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 519" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-horizontal-asymptote-title">Approaching a horizontal asymptote</title><desc id="bvlp-horizontal-asymptote-description">The curve approaches the dashed line y = 3 as x tends to positive or negative infinity. The rational curve f(x) = (3x squared - 2x + 5)/(x squared + 4) is drawn from x = -12 to x = 12. Its denominator never vanishes for real x. A dashed horizontal line marks y = 3, and both ends of the solid curve move closer to that line, showing equal limits at positive and negative infinity. The function is a heavy solid curve and the asymptote is a dashed line labeled y = 3. Caption: The rational function approaches its horizontal asymptote y = 3 at both ends. Reading order: rational-curve: Heavy solid rational curve.; asymptote: Dashed horizontal asymptote labeled y = 3.; end-note: Text identifies the shared end behavior..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-horizontal-asymptote-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stro