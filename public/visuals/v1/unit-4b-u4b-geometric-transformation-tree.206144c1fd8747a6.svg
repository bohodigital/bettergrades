<svg aria-labelledby="bvlp-unit-4b-u4b-geometric-transformation-tree-title bvlp-unit-4b-u4b-geometric-transformation-tree-description" class="bvlp-svg" data-bvlp-scene="unit-4b-u4b-geometric-transformation-tree" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4b-u4b-geometric-transformation-tree-title">The geometric series generates a family of expansions</title><desc id="bvlp-unit-4b-u4b-geometric-transformation-tree-description">A central geometric-series identity branches through substitution, scaling, differentiation, and integration to several new function series. A transformation tree branching from the geometric series. Preserve the misconception control described in the lesson and storyboard. A central geometric-series identity branches through substitution, scaling, differentiation, and integration to several new function series. A transformation tree branching from the geometric series. Preserve the misconception control described in the lesson and storyboard. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in the geometric series generates a family of expansions; color is never the only cue. Caption: The geometric series generates a family of expansions. A transformation tree branching from the geometric series. Reading order: root-box: 1/(1-x) = sum x^n box.; root-label: Label: 1/(1-x) = sum x^n.; substitute-box: substitute u(x) box.; substitute-label: Label: substitute u(x).; differentiate-box: differentiate box.; differentiate-label: Label: differentiate.; integrate-box: integrate box.; integrate-label: Label: integrate.; to-sub: Transform the input and interval.; to-derivative: Transform coefficients and powers.; to-integral: Add an integration constant.; domain: Annotation: Every branch carries a co