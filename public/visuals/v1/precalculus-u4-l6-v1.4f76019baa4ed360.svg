<svg aria-labelledby="bvlp-precalculus-u4-l6-v1-title bvlp-precalculus-u4-l6-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u4-l6-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u4-l6-v1-title">Constructing inverse functions · Coordinate reversal</title><desc id="bvlp-precalculus-u4-l6-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The inverse reverses the operations in reverse order. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The inverse reverses the operations in reverse order. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The inverse reverses the operations in reverse order. Reading order: title: Label: ORDER MATTERS: THE INNER FUNCTION ACTS FIRST.; input-card: Original price.; inner-card: Coupon stage subtracts 20.; middle-card: Intermediate price.; outer-card: Tax stage multiplies by 1.06.; one: Feed 100 to the coupon function.; two: The coupon output is 80.; three: Feed 80 to the tax function.; input: Label: $100.; inner: Label: d(p)=p−20.; middle: Label: $80.; outer: Label: t(q)=1.06q.; result: Label: t(d(100)) = 1.06(80) = $84.80.; warning: Label: Reversing the stages gives $86, so the functions do not commute...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-