<svg aria-labelledby="bvlp-unit-2b-2b-v01-title bvlp-unit-2b-2b-v01-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v01" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v01-title">A word problem becomes calculus through a translation pipeline</title><desc id="bvlp-unit-2b-2b-v01-description">Strong application work moves from the situation to named variables, then to an equation, then to a derivative, and finally back to a sentence in the original context. The derivative sits in the middle of the work. Most application errors happen before it, when variables or relationships are chosen badly, or after it, when a correct number is reported without units or meaning. The final check may send you back to the model if the answer is physically impossible. The derivative sits in the middle of the work. Most application errors happen before it, when variables or relationships are chosen badly, or after it, when a correct number is reported without units or meaning. The final check may send you back to the model if the answer is physically impossible. Strong application work moves from the situation to named variables, then to an equation, then to a derivative, and finally back to a sentence in the original context. The derivative sits in the middle of the work. Most application errors happen before it, when variables or relationships are chosen badly, or after it, when a correct number is reported without units or meaning. The final check may send you back to the model if the answer is physically impossible. Every relationship in a word problem becomes calculus through a translation pipeline is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Strong application work moves from the situation to named variables, then to an equation, then to a derivative, and finally back to a sentence in the original context. Reading order: situation-box: Box: Situation + question.; situation-label: Label: Situation + question.; variables-box: Box: Variables + units.; variables-label: Label: Variables + units.; relation-box: Box: Relationship.; relation-label: Label: Relationship.; derivative-box: Box: Differentiate.; derivative-label: Label: Differentiate.; meaning-box: Box: Interpret.; meaning-label: Label: Interpret.; check-box: Box: Check units, sign, domain, scale.; check-label: Label: Check units, sign, domain, scale.; a-arrow: Name variables; b-arrow: Build the model; c-arrow: Differentiate; d-arrow: Return to context; e-arrow: verify; e-label: Label: verify.; f-arrow: revise if unreasonable; f-label: Label: revise if unreasonable.; claim-label: Label: The derivative is the middle of a complete model—not the whole solution...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v01-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v01-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stro