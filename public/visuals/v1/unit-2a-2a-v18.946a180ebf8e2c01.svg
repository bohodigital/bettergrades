<svg aria-labelledby="bvlp-unit-2a-2a-v18-title bvlp-unit-2a-2a-v18-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v18" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v18-title">Inverse-function slopes are reciprocal because coordinates swap</title><desc id="bvlp-unit-2a-2a-v18-description">Reflecting a graph across y=x swaps horizontal and vertical changes. A tangent with slope m reflects to one with slope 1/m . The point (2,4) on y=x 2 reflects to (4,2) on y= x . The tangent slope 4 reflects to slope 1/4 . This geometric swap explains the inverse derivative formula: the inverse rate is the reciprocal of the original rate, evaluated at the matching input. Reflecting a graph across y=x swaps horizontal and vertical changes. A tangent with slope m reflects to one with slope 1/m . The point (2,4) on y=x 2 reflects to (4,2) on y= x . The tangent slope 4 reflects to slope 1/4 . This geometric swap explains the inverse derivative formula: the inverse rate is the reciprocal of the original rate, evaluated at the matching input. The visual uses labeled positions, solid and dashed line styles, and written descriptions so inverse-function slopes are reciprocal because coordinates swap does not depend on color. Caption: Reflecting a graph across y=x swaps horizontal and vertical changes. A tangent with slope m reflects to one with slope 1/m. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; relationship-3: dotted curve 3 is distinguished by line style and label.; reading-note: A written reading cue names the visual&apos;s mathematical relationship..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-se