<svg aria-labelledby="bvlp-unit-4a-u4a-alternating-brackets-title bvlp-unit-4a-u4a-alternating-brackets-description" class="bvlp-svg" data-bvlp-scene="unit-4a-u4a-alternating-brackets" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4a-u4a-alternating-brackets-title">Alternating partial sums form shrinking brackets</title><desc id="bvlp-unit-4a-u4a-alternating-brackets-description">Odd and even partial sums lie on opposite sides of the limit and the distance between them equals the next term magnitude. Odd and even partial sums nesting around a common limit. Odd and even partial sums lie on opposite sides of the limit and the distance between them equals the next term magnitude. Odd and even partial sums nesting around a common limit. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in alternating partial sums form shrinking brackets; color is never the only cue. Caption: Alternating partial sums form shrinking brackets. Odd and even partial sums nesting around a common limit. Reading order: number-line: Number line for partial sums.; limit: The limit lies between odd and even partial sums.; odd-bracket: Odd partial sum endpoint.; even-bracket: Even partial sum endpoint.; bracket: The bracket width shrinks with the next term magnitude.; odd-label: Label: odd partial sums.; even-label: Label: even partial sums.; next-term: Annotation: Adding terms tightens a certified bracket around the limit..; alternating-control: Number of alternating terms.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg