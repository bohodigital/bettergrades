<svg aria-labelledby="bvlp-unit-2b-2b-v14-title bvlp-unit-2b-2b-v14-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v14" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v14-title">The Mean Value Theorem matches an average slope somewhere inside</title><desc id="bvlp-unit-2b-2b-v14-description">For a continuous curve on [a,b] that is differentiable inside, at least one tangent line is parallel to the secant line joining the endpoints. The red secant records the average rate over the whole interval. The green tangent has the same slope at an interior point. The theorem guarantees at least one such point under its hypotheses; it does not say that the point is the midpoint or that it is unique. The red secant records the average rate over the whole interval. The green tangent has the same slope at an interior point. The theorem guarantees at least one such point under its hypotheses; it does not say that the point is the midpoint or that it is unique. For a continuous curve on [a,b] that is differentiable inside, at least one tangent line is parallel to the secant line joining the endpoints. The red secant records the average rate over the whole interval. The green tangent has the same slope at an interior point. The theorem guarantees at least one such point under its hypotheses; it does not say that the point is the midpoint or that it is unique. Every relationship in the mean value theorem matches an average slope somewhere inside is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: For a continuous curve on [a,b] that is differentiable inside, at least one tangent line is parallel to the secant line joining the endpoints. Reading order: curve: 