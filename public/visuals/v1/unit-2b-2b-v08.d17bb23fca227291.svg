<svg aria-labelledby="bvlp-unit-2b-2b-v08-title bvlp-unit-2b-2b-v08-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v08" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v08-title">Related rates use one geometric relationship at one frozen instant</title><desc id="bvlp-unit-2b-2b-v08-description">The quantities change with time, but the equation relating them is geometric or physical. Differentiate the relationship first, then substitute the measurements and rates from the instant of interest. The most important order is &quot;relationship, differentiate, substitute.&quot; If you insert snapshot numbers too early, variables disappear and the derivative has nothing left to describe. The diagram also reminds you that related-rates answers need a sign and units, not merely a magnitude. The most important order is &quot;relationship, differentiate, substitute.&quot; If you insert snapshot numbers too early, variables disappear and the derivative has nothing left to describe. The diagram also reminds you that related-rates answers need a sign and units, not merely a magnitude. The quantities change with time, but the equation relating them is geometric or physical. Differentiate the relationship first, then substitute the measurements and rates from the instant of interest. The most important order is &quot;relationship, differentiate, substitute.&quot; If you insert snapshot numbers too early, variables disappear and the derivative has nothing left to describe. The diagram also reminds you that related-rates answers need a sign and units, not merely a magnitude. Every relationship in related rates use one geometric relationship at one frozen instant is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: The quantities change with time, but the equation relating them is geometric or physical. Differentiate the relationship first, then substitute the measurements and rates from the instant of interest. Reading order: draw-box: Box: 1. Draw variables.; draw-label: Label: 1. Draw variables.; relate-box: Box: 2. Write one relation.; relate-label: Label: 2. Write one relation.; differentiate-box: Box: 3. Differentiate in time.; differentiate-label: Label: 3. Differentiate in time.; substitute-box: Box: 4. Substitute snapshot.; substitute-label: Label: 4. Substitute snapshot.; interpret-box: Box: 5. Solve, add units, check sign.; interpret-label: Label: 5. Solve, add units, check sign.; a-arrow: Model the relationship; b-arrow: Differentiate before substituting; c-arrow: Use the snapshot values; d-arrow: interpret; d-label: Label: interpret.; order-label: Label: Relationship → differentiate → substitute. Snapshot numbers come last...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v08-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v08-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fil