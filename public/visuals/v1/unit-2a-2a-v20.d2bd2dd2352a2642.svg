<svg aria-labelledby="bvlp-unit-2a-2a-v20-title bvlp-unit-2a-2a-v20-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v20" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v20-title">A function, its first derivative, and its second derivative tell a layered story</title><desc id="bvlp-unit-2a-2a-v20-description">The height of f&apos; records the slope of f . The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Where f&apos; is positive, f rises; where f&apos; is negative, f falls. Where f&quot; is positive, the slopes shown by f&apos; are increasing and f is concave up; where f&quot; is negative, f is concave down. The zeros of the lower graphs mark transitions in the graphs above them. The height of f&apos; records the slope of f . The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Where f&apos; is positive, f rises; where f&apos; is negative, f falls. Where f&quot; is positive, the slopes shown by f&apos; are increasing and f is concave up; where f&quot; is negative, f is concave down. The zeros of the lower graphs mark transitions in the graphs above them. The visual uses labeled positions, solid and dashed line styles, and written descriptions so a function, its first derivative, and its second derivative tell a layered story does not depend on color. Caption: The height of f&apos; records the slope of f. The height of f&quot; records how that slope changes. Reading the three graphs together reveals increasing behavior and concavity. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label