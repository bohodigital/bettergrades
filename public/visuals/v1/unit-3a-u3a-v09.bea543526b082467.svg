<svg aria-labelledby="bvlp-unit-3a-u3a-v09-title bvlp-unit-3a-u3a-v09-description" class="bvlp-svg" data-bvlp-scene="unit-3a-u3a-v09" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3a-u3a-v09-title">Reference triangles for trig substitution</title><desc id="bvlp-unit-3a-u3a-v09-description">Three right triangles encode x=a sin theta, x=a tan theta, and x=a sec theta. Connect radical forms to right triangles and substitution choices. State domain restrictions and the role of absolute values. Three right triangles encode x=a sin theta, x=a tan theta, and x=a sec theta. Connect radical forms to right triangles and substitution choices. State domain restrictions and the role of absolute values. Every relationship in reference triangles for trig substitution uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Reference triangles for trig substitution. Connect radical forms to right triangles and substitution choices. Reading order: triangle-one: Right triangle for square root of a squared minus x squared.; triangle-two: Right triangle for square root of x squared plus a squared.; triangle-three: Right triangle for square root of x squared minus a squared.; one-base: Label: x.; one-height: Label: √(a²−x²).; one-hyp: Label: a.; two-base: Label: a.; two-height: Label: x.; two-hyp: Label: √(x²+a²).; three-base: Label: √(x²−a²).; three-height: Label: a.; three-hyp: Label: x.; one-rule: Label: x=a sin θ.; two-rule: Label: x=a tan θ.; three-rule: Label: x=a sec θ..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;