<svg aria-labelledby="bvlp-unit-3b-u3b-v03-title bvlp-unit-3b-u3b-v03-description" class="bvlp-svg" data-bvlp-scene="unit-3b-u3b-v03" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3b-u3b-v03-title">Washer geometry</title><desc id="bvlp-unit-3b-u3b-v03-description">A vertical strip rotated around the x-axis forms a washer with outer and inner radii. Show outer radius, inner radius, and thickness for rotation around a horizontal axis. Measure radii from the axis, not from the other curve. A vertical strip rotated around the x-axis forms a washer with outer and inner radii. Show outer radius, inner radius, and thickness for rotation around a horizontal axis. Measure radii from the axis, not from the other curve. Every relationship in washer geometry uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Washer geometry. Show outer radius, inner radius, and thickness for rotation around a horizontal axis. Reading order: washer-region: Region between two curves above the rotation axis.; rotation-axis: Horizontal axis of rotation.; double segment.; moving-outer-radius: Outer radius R(x), measured from the axis.; double segment.; moving-inner-radius: Inner radius r(x), measured from the axis.; dashed segment.; outer-radius-source-label: Label: R(x): axis to upper curve.; inner-radius-source-label: Label: r(x): axis to lower curve.; outer-circle: Outer washer boundary R.; double curve.; inner-circle: Inner washer boundary r.; dashed curve.; washer-r: Inner radius r.; dashed segment.; washer-outer-radius: Outer radius R.; double segment.; washer-r-label: Label: r.; washer-outer-radius-label: Label: R.; washer-area: Label: cross-section area = pi(R squared - r squared).; washer-slice-control: Washer slice position.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-3b-u3b-v03-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-3b-u3b-v03-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-3b-u3b-v03-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-3b-u3b-v03-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-3b-u3b-v03-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-3b-u3b-v03-panel-default-title bvlp-unit-3b-u3b-v03-panel-default-desc" id="bvlp-unit-3b-u3b-v03-panel-default" role="group"><title id="bvlp-unit-3b-u3b-v03-panel-default-title">Washer geometry</title><desc id="bvlp-unit-3b-u3b-v03-panel-default-desc">A vertical strip rotated around the x-axis forms a washer with outer and inner 