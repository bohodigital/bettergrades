"#111827" font-size="13" text-anchor="start" x="84" y="39"><tspan dy="0" x="84">f(x)</tspan></text><g clip-path="url(#bvlp-ivt-root-panel-default-clip)"><g aria-label="Heavy solid continuous curve." data-layer-id="ivt-function" data-layer-kind="function" data-line-style="solid" role="group"><path d="M84,476L125.5,465.975L167,455.8L208.5,445.325L250,434.4L291.5,422.875L333,410.6L374.5,397.425L416,383.2L457.5,367.775L499,351L540.5,332.725L582,312.8L623.5,291.075L665,267.4L706.5,241.625L748,213.6L789.5,183.175L831,150.2L872.5,114.525L914,76" data-segment-index="0" fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke"/></g><g aria-label="Text states the sign-change argument." data-layer-id="ivt-note" data-layer-kind="annotation" data-line-style="solid" role="group"><line stroke="#111827" stroke-opacity="0.55" stroke-width="1" x1="283.2" x2="294.2" y1="212" y2="203"/><circle cx="283.2" cy="212" fill="#111827" r="2.5"/><text class="bvlp-annotation" data-bvlp-label-box="294.2,172.32,279.12,30.68" fill="#111827" font-size="13" text-anchor="start" x="294.2" y="185.32"><tspan dy="0" x="294.2">f(0) &lt; 0 &lt; f(1), so a root exists in</tspan><tspan dy="1.18em" x="294.2">(0, 1)</tspan></text></g><g aria-label="Filled circle at the negative left endpoint." data-layer-id="left-endpoint" data-layer-kind="closed-point" data-line-style="solid" role="group"><circle cx="84" cy="476" fill="#fca5a5" r="6" stroke="#b91c1c" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" data-bvlp-label-box="95,451.66,72.03,15.34" fill="#111827" font-size="13" text-anchor="start" x="95" y="464.66"><tspan dy="0" x="95">f(0) = -1</tspan></text></g><g aria-label="Filled square at the positive right endpoint." data-layer-id="right-endpoint" data-layer-kind="closed-point" data-line-style="solid" role="group"><rect fill="#86efac" height="12" stroke="#15803d" stroke-width="2.25" vector-effect="non-sca