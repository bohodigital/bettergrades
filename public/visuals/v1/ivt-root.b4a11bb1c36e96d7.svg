<svg aria-labelledby="bvlp-ivt-root-title bvlp-ivt-root-description" class="bvlp-svg" data-bvlp-scene="ivt-root" data-grayscale-safe="true" focusable="false" height="582" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 582" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-ivt-root-title">A root guaranteed by the Intermediate Value Theorem</title><desc id="bvlp-ivt-root-description">f(0) is negative and f(1) is positive, so continuity guarantees a root between them. The continuous curve f(x) = x cubed + x - 1 is shown on the closed interval from 0 to 1. A filled circle at (0, -1) lies below the x-axis and a filled square at (1, 1) lies above it. The curve crosses the axis at a filled diamond c approximately 0.6823, illustrating a root whose existence the Intermediate Value Theorem guarantees. The negative endpoint is a filled circle, the positive endpoint is a filled square, and the root is a filled diamond, all with text labels. Caption: Continuity and opposite endpoint signs guarantee at least one root between 0 and 1. Reading order: ivt-function: Heavy solid continuous curve.; left-endpoint: Filled circle at the negative left endpoint.; right-endpoint: Filled square at the positive right endpoint.; root: Filled diamond marks the displayed root.; ivt-note: Text states the sign-change argument..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-ivt-root-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-ivt-root-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-ivt-root-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-ivt-root-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-ivt-root-panel-default-clip"><rect height="460" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-ivt-root-panel-default-title bvlp-ivt-root-panel-default-desc" id="bvlp-ivt-root-panel-default" role="group"><title id="bvlp-ivt-root-panel-default-title">A root guaranteed by the Intermediate Value Theorem</title><desc id="bvlp-ivt-root-panel-default-desc">f(0) is negative and f(1) is positive, so continuity guarantees a root between them.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="460" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="84" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="167" x2="167" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="250" x2="250" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="333" x2="333" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="416" x2="416" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="499" x2="499" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="582" x2="582" y1="46" y2=