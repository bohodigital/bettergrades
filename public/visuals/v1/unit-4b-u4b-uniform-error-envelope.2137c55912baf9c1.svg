<svg aria-labelledby="bvlp-unit-4b-u4b-uniform-error-envelope-title bvlp-unit-4b-u4b-uniform-error-envelope-description" class="bvlp-svg" data-bvlp-scene="unit-4b-u4b-uniform-error-envelope" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4b-u4b-uniform-error-envelope-title">Pointwise error can move instead of disappearing uniformly</title><desc id="bvlp-unit-4b-u4b-uniform-error-envelope-description">Curves x n on the interval from zero to one become small at each fixed interior point, but their maximum remains near one close to the endpoint. Error envelopes for x n whose peak remains near one. Preserve the misconception control described in the lesson and storyboard. Curves x n on the interval from zero to one become small at each fixed interior point, but their maximum remains near one close to the endpoint. Error envelopes for x n whose peak remains near one. Preserve the misconception control described in the lesson and storyboard. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in pointwise error can move instead of disappearing uniformly; color is never the only cue. Caption: Pointwise error can move instead of disappearing uniformly. Error envelopes for x n whose peak remains near one. Reading order: n2: x^2; dashed curve.; n6: x^6; solid curve.; limit: pointwise limit 0 for x&lt;1; double curve.; selected-x: Selected input approaches the moving error near one.; endpoint: At x=1 every function still equals one.; uniform: Annotation: The largest error stays 1 at the endpoint, so convergence is not uniform on [0,1]..; input: Selected input x.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:70