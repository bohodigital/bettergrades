<svg aria-labelledby="bvlp-unit-2b-2b-v23-title bvlp-unit-2b-2b-v23-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v23" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v23-title">A concentration model separates amount, rate, and peak time</title><desc id="bvlp-unit-2b-2b-v23-description">The concentration curve rises, reaches a peak where its derivative is zero, and then falls. The derivative graph identifies when the medication level is increasing or decreasing most rapidly. The left graph shows the modeled concentration. The right graph shows its rate of change. The concentration peaks when the rate crosses zero from positive to negative. The model describes a simplified response, not an individual dosing recommendation; interpretation must remain within the model&apos;s assumptions. The left graph shows the modeled concentration. The right graph shows its rate of change. The concentration peaks when the rate crosses zero from positive to negative. The model describes a simplified response, not an individual dosing recommendation; interpretation must remain within the model&apos;s assumptions. The concentration curve rises, reaches a peak where its derivative is zero, and then falls. The derivative graph identifies when the medication level is increasing or decreasing most rapidly. The left graph shows the modeled concentration. The right graph shows its rate of change. The concentration peaks when the rate crosses zero from positive to negative. The model describes a simplified response, not an individual dosing recommendation; interpretation must remain within the model&apos;s assumptions. Every relationship in a concentration model separates amount, rate, and peak time is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: The concentration curve rises, reaches a peak where its derivative is zero, and then falls. The derivative graph identifies when the medication level is increasing or decreasing most rapidly. Reading order: concentration: C(t); solid line.; rate: C&apos;(t); dashed line.; peak: Filled diamond marks peak: C&apos;=0.; rate-zero: Filled circle marks rate changes sign.; assumption: Annotation: Simplified model: not an individual dosing recommendation...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v23-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v23-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v23-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v23-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#11