<svg aria-labelledby="bvlp-unit-4b-u4b-remainder-band-title bvlp-unit-4b-u4b-remainder-band-description" class="bvlp-svg" data-bvlp-scene="unit-4b-u4b-remainder-band" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4b-u4b-remainder-band-title">A remainder bound encloses the unknown error</title><desc id="bvlp-unit-4b-u4b-remainder-band-description">Taylor&apos;s theorem does not merely offer a polynomial; it gives an explicit envelope within which the true function must lie. Function, Taylor polynomial, and an error envelope widening away from the center. Taylor&apos;s theorem does not merely offer a polynomial; it gives an explicit envelope within which the true function must lie. Function, Taylor polynomial, and an error envelope widening away from the center. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in a remainder bound encloses the unknown error; color is never the only cue. Caption: A remainder bound encloses the unknown error. Function, Taylor polynomial, and an error envelope widening away from the center. Reading order: band: Certified band P_n minus B through P_n plus B.; approximation: Polynomial approximation P_n.; truth: Unknown true value lies inside the certified band.; upper: Label: P_n+B.; lower: Label: P_n-B.; bound: Annotation: |R_n(x)| &lt;= B encloses the unknown error without knowing its sign...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrec