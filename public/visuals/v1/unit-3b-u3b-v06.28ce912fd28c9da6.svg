<svg aria-labelledby="bvlp-unit-3b-u3b-v06-title bvlp-unit-3b-u3b-v06-description" class="bvlp-svg" data-bvlp-scene="unit-3b-u3b-v06" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3b-u3b-v06-title">Balance point of a nonuniform rod</title><desc id="bvlp-unit-3b-u3b-v06-description">A nonuniform rod balances at x-bar, shifted toward the denser side. Show density, weighted moment, and center of mass location. Do not imply center of mass must be geometric midpoint. A nonuniform rod balances at x-bar, shifted toward the denser side. Show density, weighted moment, and center of mass location. Do not imply center of mass must be geometric midpoint. Every relationship in balance point of a nonuniform rod uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Balance point of a nonuniform rod. Show density, weighted moment, and center of mass location. Reading order: rod-light: Low-density left part of the rod.; rod-medium: Medium-density part of the rod.; rod-heavy: High-density right part of the rod.; rod-axis: rod coordinate from zero to L; solid segment.; geometric-midpoint: Circle marks geometric midpoint.; center-of-mass: Diamond marks center of mass toward denser material.; midpoint-label: Label: geometric midpoint.; center-label: Label: balance point x-bar.; moment-rule: Annotation: The balance point satisfies x-bar = first moment divided by total mass...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg poly