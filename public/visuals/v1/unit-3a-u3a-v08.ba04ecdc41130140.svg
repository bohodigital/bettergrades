<svg aria-labelledby="bvlp-unit-3a-u3a-v08-title bvlp-unit-3a-u3a-v08-description" class="bvlp-svg" data-bvlp-scene="unit-3a-u3a-v08" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3a-u3a-v08-title">Integration by parts from the product rule</title><desc id="bvlp-unit-3a-u3a-v08-description">The product rule is rearranged to produce integral u dv = uv - integral v du. Show product rule rearranged and integrated, with u and dv roles. Do not present LIATE as a theorem; it is a heuristic. The product rule is rearranged to produce integral u dv = uv - integral v du. Show product rule rearranged and integrated, with u and dv roles. Do not present LIATE as a theorem; it is a heuristic. Every relationship in integration by parts from the product rule uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Integration by parts from the product rule. Show product rule rearranged and integrated, with u and dv roles. Reading order: product-box: Box for Product rule.; product-label: Label: Product rule.; rearrange-box: Box for Rearrange terms.; rearrange-label: Label: Rearrange terms.; integrate-box: Box for Integrate both sides.; integrate-label: Label: Integrate both sides.; p-to-r: Rearrange to isolate u dv; dashed segment.; r-to-i: Integrate the rearranged identity; dashed segment.; product-form: Label: d(uv)=u dv+v du.; parts-form: Label: u dv=d(uv)−v du.; integral-form: Label: ∫u dv=uv−∫v du.; heuristic: Annotation: Choose u so differentiating it simplifies the remaining integral; LIATE is a heuristic, not a theorem...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.