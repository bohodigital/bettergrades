<svg aria-labelledby="bvlp-unit-2a-2a-v11-title bvlp-unit-2a-2a-v11-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v11" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v11-title">Choose rules from the outside structure</title><desc id="bvlp-unit-2a-2a-v11-description">Before differentiating, identify the outermost operation. Sum, product, quotient, and composition structures determine the first rule; inner pieces are then differentiated recursively. Read an expression as a construction, not as a row of symbols. For (x 2+1) 5 , the outer operation is a fifth power applied to an inner function, so begin with the chain rule. For (x 2+1)e x , the outer operation is multiplication, so begin with the product rule. After that first choice, repeat the same analysis on each component. Before differentiating, identify the outermost operation. Sum, product, quotient, and composition structures determine the first rule; inner pieces are then differentiated recursively. Read an expression as a construction, not as a row of symbols. For (x 2+1) 5 , the outer operation is a fifth power applied to an inner function, so begin with the chain rule. For (x 2+1)e x , the outer operation is multiplication, so begin with the product rule. After that first choice, repeat the same analysis on each component. The visual uses labeled positions, solid and dashed line styles, and written descriptions so choose rules from the outside structure does not depend on color. Caption: Before differentiating, identify the outermost operation. Sum, product, quotient, and composition structures determine the first rule; inner pieces are then differentiated recursively. Reading order: start-box: Labeled box: Read the outermost operation.; sum-box: Labeled box: sum or difference.; product-box: Labeled box: product.; quotient-box: Labeled box: quotient.; composition-box: Labeled box: composition.; repeat-box: Labeled box: Apply that rule, then parse each inner piece again.; s1-arrow: Arrow preserves the instructional reading order.; s2-arrow: Arrow preserves the instructional reading order.; s3-arrow: Arrow preserves the instructional reading order.; s4-arrow: Arrow preserves the instructional reading order.; start-label: Written label identifies Read the outermost operation.; sum-label: Written label identifies sum or difference.; product-label: Written label identifies product.; quotient-label: Written label identifies quotient.; composition-label: Written label identifies composition.; repeat-label: Written label identifies Apply that rule, then parse each inner piece again..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v11-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v11-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v11-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" widt