<svg aria-labelledby="bvlp-unit-2b-2b-v24-title bvlp-unit-2b-2b-v24-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v24" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v24-title">Stopping distance has a reaction part and a braking part</title><desc id="bvlp-unit-2b-2b-v24-description">Total stopping distance is the sum of distance traveled before braking begins and distance traveled while slowing to rest. The first part grows roughly linearly with speed; the second often grows roughly quadratically. Doubling speed doubles the reaction-distance term but multiplies the quadratic braking term by four. The derivative D&apos;(v)= +v/a measures how strongly stopping distance responds to a small increase in speed. It is a sensitivity statement, not merely another distance calculation. Doubling speed doubles the reaction-distance term but multiplies the quadratic braking term by four. The derivative D&apos;(v)= +v/a measures how strongly stopping distance responds to a small increase in speed. It is a sensitivity statement, not merely another distance calculation. Total stopping distance is the sum of distance traveled before braking begins and distance traveled while slowing to rest. The first part grows roughly linearly with speed; the second often grows roughly quadratically. Doubling speed doubles the reaction-distance term but multiplies the quadratic braking term by four. The derivative D&apos;(v)= +v/a measures how strongly stopping distance responds to a small increase in speed. It is a sensitivity statement, not merely another distance calculation. Every relationship in stopping distance has a reaction part and a braking part is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Total stopping distance is the sum of distance traveled before braking begins and distance traveled while slowing to rest. The first part grows roughly linearly with speed; the second often grows roughly quadratically. Reading order: reaction: reaction distance; dashed line.; braking: braking distance; dotted line.; total: total D(v); double line.; example: Filled diamond marks D(60)=99.; doubling: Annotation: Double speed: reaction ×2, braking ×4...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v24-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v24-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v24-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v24-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp