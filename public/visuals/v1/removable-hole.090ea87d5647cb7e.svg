4155" stroke-width="1" x1="914" x2="914" y1="520" y2="528"/><text fill="#111827" font-size="11" text-anchor="middle" x="914" y="544"><tspan dy="0" x="914">5</tspan></text><text class="bvlp-axis-label" fill="#111827" font-size="13" text-anchor="end" x="914" y="563"><tspan dy="0" x="914">x</tspan></text><line stroke="#334155" stroke-width="1.5" x1="222.333" x2="222.333" y1="46" y2="524"/><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="524" y2="524"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="528"><tspan dy="0" x="76">0</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="455.714" y2="455.714"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="459.714"><tspan dy="0" x="76">1</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="387.429" y2="387.429"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="391.429"><tspan dy="0" x="76">2</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="319.143" y2="319.143"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="323.143"><tspan dy="0" x="76">3</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="250.857" y2="250.857"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="254.857"><tspan dy="0" x="76">4</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="182.571" y2="182.571"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="186.571"><tspan dy="0" x="76">5</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="114.286" y2="114.286"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="118.286"><tspan dy="0" x="76">6</tspan></text><line stroke="#334155" stroke-width="1" x1="218.333" x2="226.333" y1="46" y2="46"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="50"><tspan dy="0" x="76">7</tspan></text><text class="bvlp-axis-label" fill="#111827" font-size="13" text-anchor="end" x="77" y="39"><tspan dy="0" x="77">f(x)</tspan></text><g clip-path="url(#bvlp-removable-hole-panel-default-clip)"><g aria-label="Open circle marks the excluded point (2, 4)." data-layer-id="hole" data-layer-kind="open-point" data-line-style="solid" role="group"><circle cx="499" cy="250.857" fill="#ffffff" r="6.5" stroke="#b45309" stroke-width="3" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" data-bvlp-label-box="510,226.517,110.38,15.34" fill="#111827" font-size="13" text-anchor="start" x="510" y="239.517"><tspan dy="0" x="510">hole at (2, 4)</tspan></text></g><g aria-label="Text annotation states the limit and undefined value." data-layer-id="hole-note" data-layer-kind="annotation" data-line-style="solid" role="group"><line stroke="#111827" stroke-opacity="0.55" stroke-width="1" x1="526.667" x2="537.667" y1="203.057" y2="194.057"/><circle cx="526.667" cy="203.057" fill="#111827" r="2.5"/><text class="bvlp-annotation" data-bvlp-label-box="537.667,163.377,233.1,30.68" fill="#111827" font-size="13" text-anchor="start" x="537.667" y="176.377"><tspan dy="0" x="537.667">Both sides approach 4; f(2) is</tspan><tspan dy="1.18em" x="537.667">undefined.</tspan></text></g><g aria-label="Solid left branch stops before x = 2." data-layer-id="line-left" data-layer-kind="piecewise-branch" data-line-style="solid" role="group"><path d="M84,455.714L104.75,445.471L125.5,435.229L146.25,424.986L167,414.743L187.75,404.5L208.5,394.257L229.25,384.014L250,373.771L270.75,363.529L291.5,353.286L312.25,343.043L333,332.8L353.75,322.557L374.5,312.314L395.25,302.071L416,291.829L436.75,281.586L457.5,271.343L478.25,261.1L499,250.857" data-segment-index="0" fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke"/></g><g aria-label="Solid right branch begins after x = 2." data-layer-id="line-right" data-layer-kind="piecewise-branch" data-line-style