<svg aria-labelledby="bvlp-removable-hole-title bvlp-removable-hole-description" class="bvlp-svg" data-bvlp-scene="removable-hole" data-grayscale-safe="true" focusable="false" height="600" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-removable-hole-title">A limit at a removable hole</title><desc id="bvlp-removable-hole-description">Both branches approach the open point (2, 4), so the limit is 4 although f(2) is undefined. The line y = x + 2 is drawn on two explicit domains, one to the left of 2 and one to the right. An open circle at (2, 4) marks the missing value. Dashed horizontal and vertical guides identify x = 2 and y = 4, so the common approached height remains clear without relying on color. The curve is split into left and right branches and the missing value is an open circle with dashed coordinate guides. Caption: The function is undefined at x = 2, but nearby outputs approach 4. Reading order: line-left: Solid left branch stops before x = 2.; line-right: Solid right branch begins after x = 2.; hole: Open circle marks the excluded point (2, 4).; x-guide: Dashed vertical guide identifies x = 2.; y-guide: Dashed horizontal guide identifies y = 4.; hole-note: Text annotation states the limit and undefined value..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-removable-hole-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-removable-hole-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-removable-hole-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-removable-hole-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-removable-hole-panel-default-clip"><rect height="478" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-removable-hole-panel-default-title bvlp-removable-hole-panel-default-desc" id="bvlp-removable-hole-panel-default" role="group"><title id="bvlp-removable-hole-panel-default-title">A limit at a removable hole</title><desc id="bvlp-removable-hole-panel-default-desc">Both branches approach the open point (2, 4), so the limit is 4 although f(2) is undefined.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="478" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="84" y1="46" y2="524"/><line stroke="#e2e8f0" stroke-width="1" x1="222.333" x2="222.333" y1="46" y2="524"/><line stroke="#e2e8f0" stroke-width="1" x1="360.667" x2="360.667" y1="46" y2="524"/><line stroke="#e2e8f0" stroke-width="1" x1="499" x2="499" y1="46" y2="524"/><line stroke="#e2e8f0" stroke-width="1" x1="637.333" x2="637.333" y1="46" y2="524"/><line stroke="#e2e8f0" stroke-width="1" x1="775.667" x2="775.667" y1="46" y2="524"/><line stroke="