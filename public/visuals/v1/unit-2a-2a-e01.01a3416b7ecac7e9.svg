<svg aria-labelledby="bvlp-unit-2a-2a-e01-title bvlp-unit-2a-2a-e01-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-e01" data-grayscale-safe="true" focusable="false" height="549" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 549" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-e01-title">secant lines converging to a tangent</title><desc id="bvlp-unit-2a-2a-e01-description">Secant lines approach the tangent line to (s(t)=t 2+3t ) at (t=2 ). Show that instantaneous rate is the limit of ordinary secant slopes and connect each nonzero interval width to a visible secant line. Secant lines approach the tangent line to (s(t)=t 2+3t ) at (t=2 ). Show that instantaneous rate is the limit of ordinary secant slopes and connect each nonzero interval width to a visible secant line. The visual uses labeled positions, solid and dashed line styles, and written descriptions so secant lines converging to a tangent does not depend on color. Caption: Secant lines approach the tangent line to s(t)=t²+3t at t=2. Reading order: position-curve: Heavy solid position curve.; active-secant: Dashed secant line controlled by h.; tangent-line: Double tangent line with slope 7.; point-p: Filled circle marks the fixed point P.; point-q: Filled diamond marks the movable second point Q.; slope-note: Written slope comparison identifies convergence.; h-control: Horizontal step h.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg t