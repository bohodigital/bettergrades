<svg aria-labelledby="bvlp-squeeze-bounds-title bvlp-squeeze-bounds-description" class="bvlp-svg" data-bvlp-scene="squeeze-bounds" data-grayscale-safe="true" focusable="false" height="505" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 505" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-squeeze-bounds-title">An oscillating function squeezed to zero</title><desc id="bvlp-squeeze-bounds-description">The middle curve stays between two bounds that both approach zero, so its limit is zero. The middle curve y = x squared times sin(1/x) oscillates on separate domains to the left and right of zero. A dashed upper curve y = x squared and a dotted lower curve y = negative x squared form a narrowing envelope. The middle curve remains inside that envelope, and all three approach zero. The middle formula is undefined at zero and is never connected across it. The middle function is heavy and solid, the upper bound is dashed, and the lower bound is dotted. The inequality is also written as text. Caption: The oscillating function is trapped between -x squared and x squared, both of which approach zero. Reading order: middle-left: Heavy solid middle function on the negative side.; middle-right: Heavy solid middle function on the positive side.; upper-bound: Dashed upper bounding curve.; lower-bound: Dotted lower bounding curve.; squeeze-note: Text states the bounding inequality.; bounds-toggle: Show bounding functions.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-sv