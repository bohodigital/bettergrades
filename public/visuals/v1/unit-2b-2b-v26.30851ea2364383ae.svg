<svg aria-labelledby="bvlp-unit-2b-2b-v26-title bvlp-unit-2b-2b-v26-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v26" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v26-title">A marginal value is the slope of a total curve at one production level</title><desc id="bvlp-unit-2b-2b-v26-description">The tangent to total cost at q has slope C&apos;(q) . Over one additional unit, that slope approximates the actual cost increase C(q+1)-C(q) when the scale is appropriate. At q=5 , the tangent slope is 8 dollars per unit. That predicts that the next unit will add about 8 dollars to total cost. The actual finite increase is close but not necessarily equal, because marginal cost is an instantaneous rate while producing one full unit is a nonzero change. At q=5, the tangent slope is 8 dollars per unit. That predicts that the next unit will add about 8 dollars to total cost. The actual finite increase is close but not necessarily equal, because marginal cost is an instantaneous rate while producing one full unit is a nonzero change. The tangent to total cost at q has slope C&apos;(q) . Over one additional unit, that slope approximates the actual cost increase C(q+1)-C(q) when the scale is appropriate. At q=5 , the tangent slope is 8 dollars per unit. That predicts that the next unit will add about 8 dollars to total cost. The actual finite increase is close but not necessarily equal, because marginal cost is an instantaneous rate while producing one full unit is a nonzero change. Every relationship in a marginal value is the slope of a total curve at one production level is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: The tangent to total cost at q has slope C&apos;(q). Over one additional unit, that slope approximates the actual cost increase C(q+1)-C(q) when the scale is appropriate. Reading order: cost: C(q); solid line.; tangent: tangent at q=5; dashed line.; current: Filled circle marks q=5.; next: Filled diamond marks C(6).; predicted: Filled circle marks marginal estimate.; increment: one-unit increment; solid segment.; gap: prediction error; dotted segment..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v26-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v26-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v26-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v26-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2b-2b-v26-panel-default-clip"><rect height="436" width="830