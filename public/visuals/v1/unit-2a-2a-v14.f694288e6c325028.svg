<svg aria-labelledby="bvlp-unit-2a-2a-v14-title bvlp-unit-2a-2a-v14-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v14" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v14-title">The logarithm inherits reciprocal slopes from its inverse</title><desc id="bvlp-unit-2a-2a-v14-description">The graphs of e x and x reflect across y=x . Tangent slopes at inverse points are reciprocals, which leads to ( x)&apos;=1/x . The point (1,e) on the exponential reflects to (e,1) on the logarithm. Reflection swaps horizontal and vertical change, so slopes become reciprocals. Since the exponential slope at input 1 is e , the logarithm slope at input e is 1/e . In general, the logarithm slope at x is 1/x . The graphs of e x and x reflect across y=x . Tangent slopes at inverse points are reciprocals, which leads to ( x)&apos;=1/x . The point (1,e) on the exponential reflects to (e,1) on the logarithm. Reflection swaps horizontal and vertical change, so slopes become reciprocals. Since the exponential slope at input 1 is e , the logarithm slope at input e is 1/e . In general, the logarithm slope at x is 1/x . The visual uses labeled positions, solid and dashed line styles, and written descriptions so the logarithm inherits reciprocal slopes from its inverse does not depend on color. Caption: The graphs of e x and ln x reflect across y=x. Tangent slopes at inverse points are reciprocals, which leads to (ln x)&apos;=1/x. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; relationship-3: dotted curve 3 is distinguished by line style and label.; exp-inverse-point: Filled circle marks (1, e).; log-inverse-point: Filled diamond marks (e, 1)..</desc><style>.bvlp-sv