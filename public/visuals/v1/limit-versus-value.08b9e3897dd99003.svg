4" y1="181.545" y2="181.545"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="185.545"><tspan dy="0" x="76">8</tspan></text><line stroke="#334155" stroke-width="1" x1="246" x2="254" y1="91.182" y2="91.182"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="95.182"><tspan dy="0" x="76">10</tspan></text><text class="bvlp-axis-label" fill="#111827" font-size="13" text-anchor="end" x="77" y="39"><tspan dy="0" x="77">g(x)</tspan></text><g clip-path="url(#bvlp-limit-versus-value-panel-default-clip)"><g aria-label="Filled diamond marks the assigned function value 9." data-layer-id="function-value" data-layer-kind="closed-point" data-line-style="solid" role="group"><polygon fill="#fca5a5" points="582,129.364 589,136.364 582,143.364 575,136.364" stroke="#b91c1c" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="591" y="126.364"><tspan dy="0" x="591">g(2) = 9</tspan></text></g><g aria-label="Open circle marks the approached height 5." data-layer-id="limit-hole" data-layer-kind="open-point" data-line-style="solid" role="group"><circle cx="582" cy="317.091" fill="#ffffff" r="6.5" stroke="#b45309" stroke-width="3" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="591" y="307.091"><tspan dy="0" x="591">limit = 5</tspan></text></g><g aria-label="Solid parabola branch stops before x = 2." data-layer-id="parabola-left" data-layer-kind="piecewise-branch" data-line-style="solid" role="group"><path d="M84,452.636L108.9,465.174L133.8,475.679L158.7,484.151L183.6,490.589L208.5,494.994L233.4,497.366L258.3,497.705L283.2,496.011L308.1,492.283L333,486.523L357.9,478.729L382.8,468.902L407.7,457.042L432.6,443.148L457.5,427.222L482.4,409.262L507.3,389.269L532.2,367.243L557.1,343.183L582,317.091" data-segment-index="0" fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" ve