<svg aria-labelledby="bvlp-limit-versus-value-title bvlp-limit-versus-value-description" class="bvlp-svg" data-bvlp-scene="limit-versus-value" data-grayscale-safe="true" focusable="false" height="619" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 619" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-limit-versus-value-title">Function value versus limit</title><desc id="bvlp-limit-versus-value-description">Nearby values approach 5 while the assigned value g(2) is 9. The parabola y = x squared + 1 approaches an open circle at (2, 5) from both sides. A separate filled diamond at (2, 9) shows that g(2) equals 9. The open and filled marker shapes, labels, and split domains establish that the limit equals 5 while the function value equals 9. The limit uses an open circle and the function value uses a filled diamond, each with a text label. Caption: The nearby parabola determines the limit; the filled point determines the function value. Reading order: parabola-left: Solid parabola branch stops before x = 2.; parabola-right: Solid parabola branch resumes after x = 2.; limit-hole: Open circle marks the approached height 5.; function-value: Filled diamond marks the assigned function value 9.; value-note: Text explicitly compares the limit and function value..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-limit-versus-value-pattern-diagonal" patternUnits