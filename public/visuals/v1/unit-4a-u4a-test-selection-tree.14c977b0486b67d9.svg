<svg aria-labelledby="bvlp-unit-4a-u4a-test-selection-tree-title bvlp-unit-4a-u4a-test-selection-tree-description" class="bvlp-svg" data-bvlp-scene="unit-4a-u4a-test-selection-tree" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4a-u4a-test-selection-tree-title">Choose a convergence test from the series structure</title><desc id="bvlp-unit-4a-u4a-test-selection-tree-description">A flowchart begins with the term limit, then branches to geometric, telescoping, positive-term comparison, alternating, factorial, and nth-power structures. A decision tree beginning with the term test and branching by structure. A flowchart begins with the term limit, then branches to geometric, telescoping, positive-term comparison, alternating, factorial, and nth-power structures. A decision tree beginning with the term test and branching by structure. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in choose a convergence test from the series structure; color is never the only cue. Caption: Choose a convergence test from the series structure. A decision tree beginning with the term test and branching by structure. Reading order: start: Start with the nth-term limit.; start-label: Label: Does a_n approach 0?.; branch-0: Decision branch: geometric / telescoping.; branch-label-0: Label: geometric / telescoping.; branch-line-0: Flow to geometric / telescoping.; branch-1: Decision branch: positive comparison.; branch-label-1: Label: positive comparison.; branch-line-1: Flow to positive comparison.; branch-2: Decision branch: alternating signs.; branch-label-2: Label: alternating signs.; branch-line-2: Flow to alternating signs.; method-0: Method family: exact structure.; method-label-0: Label: exact structure.; method-line-0: Continue to exact structure.; method-1: Method family: integral / direct / limit.; method-label-1: Label: integral / direct / limit.; method-line-1: Continue to integral / direct / limit.; method-2: Method family: alternating, then absolute.; method-label-2: Label: alternating, then absolute.; method-line-2: Continue to alternating, then absolute.; decision-warning: Annotation: Factorials or nth powers may instead point to the Ratio or Root Test; no keyword alone proves convergence...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-4a-u4a-test-selection-tree-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-4a-u4a-test-selection-tree-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-4a-u4a-test-selection-tree-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-4a-u4a-test-selection-tree-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill