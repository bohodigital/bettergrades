<svg aria-labelledby="bvlp-unit-3a-u3a-v07-title bvlp-unit-3a-u3a-v07-description" class="bvlp-svg" data-bvlp-scene="unit-3a-u3a-v07" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3a-u3a-v07-title">Substitution as relabeling a composed differential</title><desc id="bvlp-unit-3a-u3a-v07-description">A flow diagram shows an inner function and its derivative being replaced by u and du. Map inner expression u=g(x), differential du=g prime dx, and simplified integral. Do not teach substitution as arbitrary symbol swapping. A flow diagram shows an inner function and its derivative being replaced by u and du. Map inner expression u=g(x), differential du=g prime dx, and simplified integral. Do not teach substitution as arbitrary symbol swapping. Every relationship in substitution as relabeling a composed differential uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Substitution as relabeling a composed differential. Map inner expression u=g(x), differential du=g prime dx, and simplified integral. Reading order: recognize-box: Box for Match inner x².; recognize-label: Label: Match inner x².; substitute-box: Box for Set u=x².; substitute-label: Label: Set u=x².; integrate-box: Box for Integrate cos u.; integrate-label: Label: Integrate cos u.; return-box: Box for Back-substitute.; return-label: Label: Back-substitute.; a: The differential 2x dx becomes du; dashed segment.; b: The u-integral is simpler; dashed segment.; c: The final step restores x; dashed segment.; start: Label: ∫ 2x cos(x²) dx → ∫ cos(u) du → sin(x²)+C.; warning: Annotation: Substitution preserves the differential; it is not arbitrary symbol swapping...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,