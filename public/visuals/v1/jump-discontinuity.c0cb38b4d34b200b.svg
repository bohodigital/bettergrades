<svg aria-labelledby="bvlp-jump-discontinuity-title bvlp-jump-discontinuity-description" class="bvlp-svg" data-bvlp-scene="jump-discontinuity" data-grayscale-safe="true" focusable="false" height="582" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 582" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-jump-discontinuity-title">Unequal one-sided limits</title><desc id="bvlp-jump-discontinuity-description">The left branch approaches 3 and the right branch approaches 4, so the two-sided limit does not exist. For x less than 2, the line y = x + 1 approaches the open circle (2, 3). For x at least 2, the line y = 6 - x begins at the filled diamond (2, 4). Text labels state that the left-hand limit is 3 and the right-hand limit is 4, so the two-sided limit does not exist. The left branch is solid with an open circle; the right branch is double-stroked with a filled diamond. Labels give both one-sided heights. Caption: Unequal one-sided limits produce a jump and no two-sided limit. Reading order: left-branch: Solid left branch terminates at an open point.; left-limit: Open circle at (2, 3) marks the left-hand height.; right-branch: Double-stroked right branch begins at a filled point.; right-value: Filled diamond at (2, 4) marks the included right-hand value.; target-guide: Dashed vertical guide identifies x = 2.; jump-note: Text states why the two-sided limit does not exist..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg 