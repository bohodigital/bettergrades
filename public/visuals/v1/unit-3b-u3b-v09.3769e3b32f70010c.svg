<svg aria-labelledby="bvlp-unit-3b-u3b-v09-title bvlp-unit-3b-u3b-v09-description" class="bvlp-svg" data-bvlp-scene="unit-3b-u3b-v09" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3b-u3b-v09-title">Pressure increasing with depth on a submerged plate</title><desc id="bvlp-unit-3b-u3b-v09-description">Pressure arrows grow with depth; force on strip equals pressure times strip area. Show horizontal strip, depth, pressure, strip width, and force. Depth is measured below surface, not from tank bottom unless coordinates are converted. Pressure arrows grow with depth; force on strip equals pressure times strip area. Show horizontal strip, depth, pressure, strip width, and force. Depth is measured below surface, not from tank bottom unless coordinates are converted. Every relationship in pressure increasing with depth on a submerged plate uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: Pressure increasing with depth on a submerged plate. Show horizontal strip, depth, pressure, strip width, and force. Reading order: waterline: Water surface; depth begins here.; double segment.; submerged-plate: Submerged plate narrows with depth.; pressure-strip: Representative horizontal strip with width w(y) and thickness dy.; depth: depth y below the surface; dashed segment.; pressure-arrow-1: Pressure arrow 1 grows with depth.; double segment.; pressure-arrow-2: Pressure arrow 2 grows with depth.; double segment.; pressure-arrow-3: Pressure arrow 3 grows with depth.; double segment.; pressure-arrow-4: Pressure arrow 4 grows with depth.; double segment.; strip-width: Label: strip area = w(y) dy.; force-rule: Annotation: Strip force = weight density times depth times strip area...</desc><style>.bv