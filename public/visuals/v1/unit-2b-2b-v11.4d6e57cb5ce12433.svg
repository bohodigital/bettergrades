<svg aria-labelledby="bvlp-unit-2b-2b-v11-title bvlp-unit-2b-2b-v11-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v11" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v11-title">Shadow problems are similar-triangle problems</title><desc id="bvlp-unit-2b-2b-v11-description">A light, a person, and the shadow tip form one large triangle. The person&apos;s height and shadow form a smaller triangle. Their proportional sides connect walking speed to shadow growth. The large triangle has height H and base x+s . The smaller triangle has height h and base s . Similarity gives H/(x+s)=h/s . Notice that the shadow tip&apos;s distance from the light is x+s , not just s . The large triangle has height H and base x+s. The smaller triangle has height h and base s. Similarity gives H/(x+s)=h/s. Notice that the shadow tip&apos;s distance from the light is x+s, not just s. A light, a person, and the shadow tip form one large triangle. The person&apos;s height and shadow form a smaller triangle. Their proportional sides connect walking speed to shadow growth. The large triangle has height H and base x+s . The smaller triangle has height h and base s . Similarity gives H/(x+s)=h/s . Notice that the shadow tip&apos;s distance from the light is x+s , not just s . Every relationship in shadow problems are similar-triangle problems is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: A light, a person, and the shadow tip form one large triangle. The person&apos;s height and shadow form a smaller triangle. Their proportional sides connect walking speed to shadow growth. Reading order: ground: ground; solid segment.; lamp: light height H; solid segment.; light: Filled circle marks light source.; person: person height h; solid segment.; ray: light ray to shadow tip; dashed segment.; walk: person distance x; solid segment.; shadow: shadow length s; solid segment.; lamp-label: Label: H.; person-label: Label: h.; walk-label: Label: x.; shadow-label: Label: s.; large: Label: large base x+s.; relation: Label: H/(x+s) = h/s.; tip: Filled diamond marks shadow tip..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v11-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v11-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v11-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v11-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2b-2b-v11-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath><