<svg aria-labelledby="bvlp-unit-2b-2b-v07-title bvlp-unit-2b-2b-v07-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v07" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v07-title">Newton&apos;s method turns tangent lines into improved root estimates</title><desc id="bvlp-unit-2b-2b-v07-description">At each estimate, the tangent line is easier to solve than the curve. Its x -intercept becomes the next estimate. Repeating the construction can converge rapidly to a root. The first tangent begins at (2,2) and crosses the axis at x 1=1.5 . The next tangent begins on the curve at x 1 and crosses near x 2=1.4167 . The intercepts move toward 2 . Each step uses x n+1 =x n-f(x n)/f&apos;(x n) . The first tangent begins at (2,2) and crosses the axis at x 1=1.5. The next tangent begins on the curve at x 1 and crosses near x 2=1.4167. The intercepts move toward 2. Each step uses x n+1 =x n-f(x n)/f&apos;(x n). At each estimate, the tangent line is easier to solve than the curve. Its x -intercept becomes the next estimate. Repeating the construction can converge rapidly to a root. The first tangent begins at (2,2) and crosses the axis at x 1=1.5 . The next tangent begins on the curve at x 1 and crosses near x 2=1.4167 . The intercepts move toward 2 . Each step uses x n+1 =x n-f(x n)/f&apos;(x n) . Every relationship in newton&apos;s method turns tangent lines into improved root estimates is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: At each estimate, the tangent line is easier to solve than the curve. Its x-intercept becomes the next estimate. Repeating the construction can converge rapidly to a root. Reading order: curve: f(x)=x^2-2; solid line.; tan