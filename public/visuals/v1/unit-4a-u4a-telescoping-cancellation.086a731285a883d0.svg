<svg aria-labelledby="bvlp-unit-4a-u4a-telescoping-cancellation-title bvlp-unit-4a-u4a-telescoping-cancellation-description" class="bvlp-svg" data-bvlp-scene="unit-4a-u4a-telescoping-cancellation" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4a-u4a-telescoping-cancellation-title">Interior terms cancel; boundary terms survive</title><desc id="bvlp-unit-4a-u4a-telescoping-cancellation-description">A finite telescoping partial sum is displayed as shifted positive and negative rows. Matching interior terms cancel, leaving only terms at the two ends. A cancellation chain showing interior terms disappearing while boundary terms remain. Preserve the misconception control described in the lesson and storyboard. A finite telescoping partial sum is displayed as shifted positive and negative rows. Matching interior terms cancel, leaving only terms at the two ends. A cancellation chain showing interior terms disappearing while boundary terms remain. Preserve the misconception control described in the lesson and storyboard. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in interior terms cancel; boundary terms survive; color is never the only cue. Caption: Interior terms cancel; boundary terms survive. A cancellation chain showing interior terms disappearing while boundary terms remain. Reading order: positive-row: Label: +1   +1/2   +1/3   +1/4   + ... +1/N.; negative-row: Label:      -1/2   -1/3   -1/4   - ... -1/(N+1).; cancel-0: Matching interior terms cancel.; cancel-1: Matching interior terms cancel.; cancel-2: Matching interior terms cancel.; cancel-3: Matching interior terms cancel.; cancel-4: Matching interior terms cancel.; left-boundary: The first boundary term survives.; right-boundary: The final negative bounda