<svg aria-labelledby="bvlp-unit-2a-2a-v04-title bvlp-unit-2a-2a-v04-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v04" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v04-title">Tangent and normal lines at the same point</title><desc id="bvlp-unit-2a-2a-v04-description">The tangent follows the curve&apos;s local direction. The normal passes through the same point at a right angle, so its slope is the negative reciprocal of the tangent slope when both slopes are finite and nonzero. Both lines pass through the point (2,0) . The green line matches the curve&apos;s immediate direction and has slope 2 . The purple line is perpendicular, so its slope is -1/2 . The two equations therefore come from the same point but different slope information. The tangent follows the curve&apos;s local direction. The normal passes through the same point at a right angle, so its slope is the negative reciprocal of the tangent slope when both slopes are finite and nonzero. Both lines pass through the point (2,0) . The green line matches the curve&apos;s immediate direction and has slope 2 . The purple line is perpendicular, so its slope is -1/2 . The two equations therefore come from the same point but different slope information. The visual uses labeled positions, solid and dashed line styles, and written descriptions so tangent and normal lines at the same point does not depend on color. Caption: The tangent follows the curve&apos;s local direction. The normal passes through the same point at a right angle, so its slope is the negative reciprocal of the tangent slope when both slopes are finite and nonzero. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.;