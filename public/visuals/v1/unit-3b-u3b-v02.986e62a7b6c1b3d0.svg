<svg aria-labelledby="bvlp-unit-3b-u3b-v02-title bvlp-unit-3b-u3b-v02-description" class="bvlp-svg" data-bvlp-scene="unit-3b-u3b-v02" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-3b-u3b-v02-title">A solid assembled from cross-sectional slices</title><desc id="bvlp-unit-3b-u3b-v02-description">A solid is decomposed into thin slabs; each slab volume is approximately A(x)dx. Show a base interval, one cross-section, and stacked slices. Do not imply slices are literally infinitesimal physical objects. A solid is decomposed into thin slabs; each slab volume is approximately A(x)dx. Show a base interval, one cross-section, and stacked slices. Do not imply slices are literally infinitesimal physical objects. Every relationship in a solid assembled from cross-sectional slices uses written labels together with distinct line styles, markers, or fill patterns; color is never the only carrier of meaning. Caption: A solid assembled from cross-sectional slices. Show a base interval, one cross-section, and stacked slices. Reading order: solid-body: Perspective body decomposed into thin slabs.; front-face: Representative cross-section at the front of the solid.; slice-1: Slab boundary 1.; dashed segment.; slice-2: Slab boundary 2.; dashed segment.; slice-3: Slab boundary 3.; dashed segment.; slice-4: Slab boundary 4.; dashed segment.; slice-5: Slab boundary 5.; dashed segment.; thickness: slice thickness dx; double segment.; cross-section-label: Label: cross-sectional area A(x).; volume-rule: Annotation: One slab is approximately A(x) dx; integration adds all slabs...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:s