<svg aria-labelledby="bvlp-precalculus-u16-l7-v1-title bvlp-precalculus-u16-l7-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u16-l7-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u16-l7-v1-title">Intuitive limits · Approach arrows toward a hole</title><desc id="bvlp-precalculus-u16-l7-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Factoring and cancellation can reveal the behavior near a removable hole, while conjugates or common denominators can remove other indeterminate forms. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Factoring and cancellation can reveal the behavior near a removable hole, while conjugates or common denominators can remove other indeterminate forms. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Factoring and cancellation can reveal the behavior near a removable hole, while conjugates or common denominators can remove other indeterminate forms. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Reading order: left-piece: simplified branch y=x+1; solid curve.; right-piece: simplified branch y=x+1; solid curve.; hole: Open circle marks excluded point creates a hole.; vertical-guide: inspect behavior as x approaches 1; title: Label: Approach arrows toward a hole.; limit-note: Label: Nearby values approach 2 even though the original expression is undefined at x=1...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-precalculus-u16-l7-v1-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-precalculus-u16-l7-v1-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-precalculus-u16-l7-v1-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-precalculus-u16-l7-v1-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath 