<svg aria-labelledby="bvlp-unit-circle-squeeze-title bvlp-unit-circle-squeeze-description" class="bvlp-svg" data-bvlp-scene="unit-circle-squeeze" data-grayscale-safe="true" focusable="false" height="680" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 680" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-circle-squeeze-title">Unit-circle squeeze geometry</title><desc id="bvlp-unit-circle-squeeze-description">For angles strictly between zero and pi over two, the inner triangle lies within the sector, which lies within the outer triangle. A unit circle is centered at O = (0, 0). A = (1, 0), B = (cos theta, sin theta), and T = (1, tan theta). Segments form an inner triangle OAB and an outer tangent triangle OAT, while the circle arc and radii bound the sector AOB. Patterned regions and a written inequality show inner triangle area less than or equal to sector area less than or equal to outer triangle area. The inner triangle has diagonal hatching, the sector has dots, and the outer triangle has crosshatching. Point shapes and line styles are distinct and all points are labeled. Caption: For a unit circle and 0 &lt; theta &lt; pi/2, the inner triangle lies inside the sector, which lies inside the outer tangent triangle. Reading order: unit-circle: Solid unit circle centered at O.; point-o: Filled point O at the center.; point-a: Filled point A at (1, 0).; point-b: Filled diamond B moves along the circle.; point-t: Filled square T lies on the vertical tangent through A.; radius-oa: Solid radius from O to A.; radius-ob: Double-stroked radius from O to B.; chord-ab: Dashed chord AB bounds the inner triangle.; tangent-at-a: Dotted vertical tangent segment AT.; outer-ray: Double-stroked segment OT bounds the outer triangle.; inner-triangle: Diagonal-patterned inner triangle OAB.; sector-region: Dotted sector region bounded by the circle arc and radii OA and OB.; outer-triangle: Crosshatched outer triangle OAT.; area-note: Text states the containment inequality.; theta-control: Angle theta in radians.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-circle-squeeze-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-circle-squeeze-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-circle-squeeze-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-circle-squeeze-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-circle-squeeze-panel-default-clip"><rect height="558" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-circle-squeeze-panel-default-title bvlp-unit-circle-squeeze-panel-default-desc" id="bvlp-unit-circle-squeeze-panel-default" role="group"><title id="bvlp-unit-circle-squeeze-panel-default-title">Unit-circle squeeze geometry</title><desc id="bvlp-unit-circle-squeeze-panel-default-desc">For angles strictly between zero and pi over two, the inner triangle lies within the sector, which lies within the outer triangle.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="558" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><g clip-path="url(#bvlp-unit-circle-squeeze-panel-default-clip)"><g aria-label="Text states the containment inequality." data-layer-id="area-note" data-layer-kind="annotation" data-line-style="solid" role="group"><circle cx="206.963" cy="97.508" fill="#111827" r="2.5"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="214.963" y="89.508"><tspan dy="0" x="214.963">inner triangle area &lt;= sector area &lt;=</tspan><tspan dy="1.18em" x="214.963">outer triangle area</tspan></text></g><g aria-label="Dashed chord AB bounds the inner triangle." data-layer-id="chord-ab" data-layer-kind="segment" data-line-style="dashed" role="group"><line fill="none" stroke="#15803d" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="760.296" x2="666.874" y1="561.077" y2="333.619"/></g><g aria-label="Diagonal-patterned inner triangle OAB." data-layer-id="inner-triangle" data-layer-kind="polygon" data-line-style="solid" role="group"><polygon fill="url(#bvlp-unit-circle-squeeze-pattern-diagonal)" fill-opacity="0.38" points="145.481,561.077 760.296,561.077 666.874,333.619" stroke="#15803d" stroke-width="2" vector-effect="non-scaling-stroke"/></g><g aria-label="Double-stroked segment OT bounds the outer triangle." data-layer-id="outer-ray" data-layer-kind="segment" data-line-style="double" role="group"><line fill="none" stroke="#b45309" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" vector-effect="non-scaling-stroke" x1="145.481" x2="760.296" y1="561.077" y2="292.864"/><line fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" vector-effect="non-scaling-stroke" x1="145.481" x2="760.296" y1="561.077" y2="292.864"/></g><g aria-label="Crosshatched outer triangle OAT." data-layer-id="outer-triangle" data-layer-kind="polygon" data-line-style="solid" role="group"><polygon fill="url(#bvlp-unit-circle-squeeze-pattern-crosshatch)" fill-opacity="0.38" points="145.481,561.077 760.296,561.077 760.296,292.864" stroke="#b45309" stroke-width="2" vector-effect="non-scaling-stroke"/></g><g aria-label="Filled point A at (1, 0)." data-layer-id="point-a" data-layer-kind="closed-point" data-line-style="solid" role="group"><circle cx="760.296" cy="561.077" fill="#cbd5e1" r="6" stroke="#111827" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="769.296" y="551.077"><tspan dy="0" x="769.296">A</tspan></text></g><g aria-label="Filled diamond B moves along the circle." data-layer-id="point-b" data-layer-kind="closed-point" data-line-style="solid" role="group"><polygon fill="#67e8f9" points="666.874,326.619 673.874,333.619 666.874,340.619 659.874,333.619" stroke="#155e75" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="675.874" y="323.619"><tspan dy="0" x="675.874">B</tspan></text></g><g aria-label="Filled point O at the center." data-layer-id="point-o" data-layer-kind="closed-point" data-line-style="solid" role="group"><circle cx="145.481" cy="561.077" fill="#cbd5e1" r="6" stroke="#111827" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="154.481" y="551.077"><tspan dy="0" x="154.481">O</tspan></text></g><g aria-label="Filled square T lies on the vertical tangent through A." data-layer-id="point-t" data-layer-kind="closed-point" data-line-style="solid" role="group"><rect fill="#fcd34d" height="12" stroke="#b45309" stroke-width="2.25" vector-effect="non-scaling-stroke" width="12" x="754.296" y="286.864"/><text class="bvlp-annotation" fill="#111827" font-size="13" text-anchor="start" x="769.296" y="282.864"><tspan dy="0" x="769.296">T</tspan></text></g><g aria-label="Solid radius from O to A." data-layer-id="radius-oa" data-layer-kind="segment" data-line-style="solid" role="group"><line fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="145.481" x2="760.296" y1="561.077" y2="561.077"/></g><g aria-label="Double-stroked radius from O to B." data-layer-id="radius-ob" data-layer-kind="segment" data-line-style="double" role="group"><line fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" vector-effect="non-scaling-stroke" x1="145.481" x2="666.874" y1="561.077" y2="333.619"/><line fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" vector-effect="non-scaling-stroke" x1="145.481" x2="666.874" y1="561.077" y2="333.619"/></g><g aria-label="Dotted sector region bounded by the circle arc and radii OA and OB." data-layer-id="sector-region" data-layer-kind="region" data-line-style="solid" role="group"><path d="M145.481 561.077L760.296 561.077L760.13 551.089L759.631 541.107L758.799 531.135L757.635 521.18L756.139 511.246L754.313 501.34L752.157 491.465L749.673 481.628L746.861 471.835L743.724 462.089L740.263 452.398L736.479 442.765L732.376 433.196L727.955 423.697L723.218 414.271L718.169 404.926L712.81 395.665L707.143 386.493L701.172 377.416L694.9 368.439L688.331 359.565L681.467 350.801L674.314 342.151L666.874 333.619Z" fill="url(#bvlp-unit-circle-squeeze-pattern-dots)" fill-opacity="0.48" stroke="#111827" stroke-width="1.25"/></g><g aria-label="Dotted vertical tangent segment AT." data-layer-id="tangent-at-a" data-layer-kind="segment" data-line-style="dotted" role="group"><line fill="none" stroke="#b45309" stroke-dasharray="2 6" stroke-linecap="round