<svg aria-labelledby="bvlp-precalculus-u10-l1-v1-title bvlp-precalculus-u10-l1-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u10-l1-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u10-l1-v1-title">Building the sine graph from circular motion · Linked unit-circle point and sine graph</title><desc id="bvlp-precalculus-u10-l1-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The graph is not an arbitrary wave. Every point (t,sin t) is paired with the same input’s position on the circle. The rising and falling portions correspond to the point moving upward or downward. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The graph is not an arbitrary wave. Every point (t,sin t) is paired with the same input’s position on the circle. The rising and falling portions correspond to the point moving upward or downward. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: The graph is not an arbitrary wave. Every point (t,sin t) is paire