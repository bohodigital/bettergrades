<svg aria-labelledby="bvlp-unit-2a-2a-v06-title bvlp-unit-2a-2a-v06-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v06" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v06-title">Estimating a derivative from nearby data</title><desc id="bvlp-unit-2a-2a-v06-description">A backward difference uses data to the left, a forward difference uses data to the right, and a central difference spans both sides of the target. The central secant is often the best estimate when the spacing is symmetric. At x=2 , the true slope of x 2 is 4 . The left secant underestimates it and the right secant overestimates it. The central secant through the points at x=1 and x=3 has slope 4 , exactly matching the derivative in this symmetric quadratic example. In real data, the match is usually approximate rather than exact. A backward difference uses data to the left, a forward difference uses data to the right, and a central difference spans both sides of the target. The central secant is often the best estimate when the spacing is symmetric. At x=2 , the true slope of x 2 is 4 . The left secant underestimates it and the right secant overestimates it. The central secant through the points at x=1 and x=3 has slope 4 , exactly matching the derivative in this symmetric quadratic example. In real data, the match is usually approximate rather than exact. The visual uses labeled positions, solid and dashed line styles, and written descriptions so estimating a derivative from nearby data does not depend on color. Caption: A backward difference uses data to the left, a forward difference uses data to the right, and a central difference spans both sides of the target. The central secant is often the best estimate when the spacing is symmetric. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; reading-note: A written reading cue names the visual&apos;s mathematical relationship..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v06-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v06-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v06-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2a-2a-v06-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2a-2a-v06-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2a-2a-v06-panel-default-title bvlp-unit-2a-2a-v06-panel-default-desc" id="bvlp-unit-2a-2a-v06-panel-default" role="group"><title id="bvlp-unit-2a-2a-v