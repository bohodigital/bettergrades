<svg aria-labelledby="bvlp-precalculus-u9-l6-v1-title bvlp-precalculus-u9-l6-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u9-l6-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u9-l6-v1-title">Wrapping the real line around the unit circle · Real-line strip wrapped around a circle</title><desc id="bvlp-precalculus-u9-l6-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Positive t moves counterclockwise and negative t moves clockwise. Reducing t modulo 2pi identifies a convenient coterminal input without changing the terminal point. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Positive t moves counterclockwise and negative t moves clockwise. Reducing t modulo 2pi identifies a convenient coterminal input without changing the terminal point. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Positive t moves counterclockwise and negative t moves clockwise. Reducing t modulo 2pi identifies a convenient coterminal input without changing the terminal point. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Reading order: figure-kicker: Label: Real-line strip wrapped around a circle.; horizontal-axis: horizontal cosine axis; vertical-axis: vertical sine axis; unit-circle: unit circle x²+y²=1; solid curve.; directed-arc: directed arc records signed rotation; solid curve.; terminal-ray: terminal ray from the origin; terminal-point: Filled diamond marks terminal point (0.50, -0.87).; sine-coordinate: vertical projection gives sine; cosine-coordinate: horizontal projection gives cosine; angle-label: Label: θ = 300°.; positive-direction: Label: CCW: +  ·  CW: −.; coordinate-meaning: Label: P(θ) = (0.50, -0.87)..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-precalculus-u9-l6-v1-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-precalculus-u9-l6-v1-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-precalculus-u9-l6-v1-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"