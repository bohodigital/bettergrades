ecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-4a-u4a-sequence-index-machine-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-4a-u4a-sequence-index-machine-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-4a-u4a-sequence-index-machine-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-4a-u4a-sequence-index-machine-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-4a-u4a-sequence-index-machine-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-4a-u4a-sequence-index-machine-panel-default-title bvlp-unit-4a-u4a-sequence-index-machine-panel-default-desc" id="bvlp-unit-4a-u4a-sequence-index-machine-panel-default" role="group"><title id="bvlp-unit-4a-u4a-sequence-index-machine-panel-default-title">The index selects one term at a time</title><desc id="bvlp-unit-4a-u4a-sequence-index-machine-panel-default-desc">A sequence is a function whose allowed inputs are integers. Each input selects one ordered term. Index-to-term machine plus discrete point graph.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="436" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><g clip-path="url(#bvl