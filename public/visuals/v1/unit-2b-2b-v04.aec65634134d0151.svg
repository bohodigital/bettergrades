<svg aria-labelledby="bvlp-unit-2b-2b-v04-title bvlp-unit-2b-2b-v04-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v04" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v04-title">Finite data produce derivative estimates, not exact derivatives</title><desc id="bvlp-unit-2b-2b-v04-description">Forward, backward, and central differences use different neighboring measurements. Symmetric data often make the central estimate more accurate, but measurement noise and spacing still matter. At the target time t=3 , the lines use measurements on different sides. The estimates are close but not identical because the temperature curve is not perfectly linear. A derivative estimated from a table should therefore be reported with appropriate precision and with the units degrees Celsius per minute. At the target time t=3, the lines use measurements on different sides. The estimates are close but not identical because the temperature curve is not perfectly linear. A derivative estimated from a table should therefore be reported with appropriate precision and with the units degrees Celsius per minute. Forward, backward, and central differences use different neighboring measurements. Symmetric data often make the central estimate more accurate, but measurement noise and spacing still matter. At the target time t=3 , the lines use measurements on different sides. The estimates are close but not identical because the temperature curve is not perfectly linear. A derivative estimated from a table should therefore be reported with appropriate precision and with the units degrees Celsius per minute. Every relationship in finite data produce derivative estimates, not exact derivatives is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Forward, backward, and central differences use different neighboring measurements. Symmetric data often make the central estimate more accurate, but measurement noise and spacing still matter. Reading order: temperature: measured data; solid line.; target: Filled diamond marks target t=3.; backward: backward difference; dashed segment.; forward: forward difference; dotted segment.; central: central difference; double segment.; estimate: Annotation: Include units and data spacing...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v04-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v04-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v04-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v04-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 