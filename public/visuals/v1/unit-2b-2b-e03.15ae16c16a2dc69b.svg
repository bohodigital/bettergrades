<svg aria-labelledby="bvlp-unit-2b-2b-e03-title bvlp-unit-2b-2b-e03-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-e03" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-e03-title">Newton iteration tool</title><desc id="bvlp-unit-2b-2b-e03-description">A coordinate graph shows a function, the current iterate, its tangent line, and the next x-intercept. A synchronized table lists each iterate, residual, and error when a reference root is known. Previous steps remain as a light trail. Controls allow step, undo, reset, and starting-value changes. Failure states such as a nearly horizontal tangent, divergence, or a two-cycle are explained in text and equations. See the adjacent lesson prose and the detailed editorial brief. A coordinate graph shows a function, the current iterate, its tangent line, and the next x-intercept. A synchronized table lists each iterate, residual, and error when a reference root is known. Previous steps remain as a light trail. Controls allow step, undo, reset, and starting-value changes. Failure states such as a nearly horizontal tangent, divergence, or a two-cycle are explained in text and equations. Every relationship in newton iteration tool is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Newton iteration tool Reading order: newton-curve: f(x)=x^2-2; solid line.; current-tangent: tangent at current iterate n; dashed line.; current-point: Filled circle marks current point on curve.; next-intercept: Filled diamond marks next Newton estimate.; formula: Annotation: next = n - f(n)/f&apos;(n).; n-control: Newton iteration.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-e03-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-e03-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-e03-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-e03-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2b-2b-e03-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2b-2b-e03-panel-default-title bvlp-unit-2b-2b-e03-panel-default-desc" id="bvlp-unit-2b-2b-e03-panel-default" role="group"><title id="bvlp-unit-2b-2b-e03-panel-default-title">Newton iteration tool</title><desc id="bvlp-unit-2b-2b-e03-panel-default-desc">A coordinate graph shows a function, the current iterate, its tangent line, and the next x-intercept. A synchronized table lists each iterate, residual, and error when a reference root is known. Previous st