<svg aria-labelledby="bvlp-unit-4b-u4b-gaussian-series-integral-title bvlp-unit-4b-u4b-gaussian-series-integral-description" class="bvlp-svg" data-bvlp-scene="unit-4b-u4b-gaussian-series-integral" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-4b-u4b-gaussian-series-integral-title">Polynomial approximations make a nonelementary integral computable</title><desc id="bvlp-unit-4b-u4b-gaussian-series-integral-description">The curve e to the negative x squared is compared with two truncated series on the interval from zero to one half, with the area under each shown. The integrand and successive polynomial approximations over the integration interval. Preserve the misconception control described in the lesson and storyboard. The curve e to the negative x squared is compared with two truncated series on the interval from zero to one half, with the area under each shown. The integrand and successive polynomial approximations over the integration interval. Preserve the misconception control described in the lesson and storyboard. Written labels, distinct line styles, markers, and fill patterns communicate every relationship in polynomial approximations make a nonelementary integral computable; color is never the only cue. Caption: Polynomial approximations make a nonelementary integral computable. The integrand and successive polynomial approximations over the integration interval. Reading order: gaussian: e^(-x^2); double curve.; polynomial: series polynomial; solid curve.; area: Polynomial area integrated term by term from zero to one.; integral: Annotation: A finite polynomial approximates a definite integral with no elementary antiderivative...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-l