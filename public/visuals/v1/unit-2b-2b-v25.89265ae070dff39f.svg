<svg aria-labelledby="bvlp-unit-2b-2b-v25-title bvlp-unit-2b-2b-v25-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v25" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v25-title">Input tolerance becomes output uncertainty through the derivative</title><desc id="bvlp-unit-2b-2b-v25-description">A small measurement interval around x maps to an output interval around f(x) . The local slope estimates how much the output uncertainty is amplified or reduced. Near x=2 for f(x)=x 2 , the slope is 4 . An input uncertainty of about 0.1 therefore produces an output uncertainty of roughly 0.4 . The derivative is acting as a local amplification factor. Near x=2 for f(x)=x 2, the slope is 4. An input uncertainty of about 0.1 therefore produces an output uncertainty of roughly 0.4. The derivative is acting as a local amplification factor. A small measurement interval around x maps to an output interval around f(x) . The local slope estimates how much the output uncertainty is amplified or reduced. Near x=2 for f(x)=x 2 , the slope is 4 . An input uncertainty of about 0.1 therefore produces an output uncertainty of roughly 0.4 . The derivative is acting as a local amplification factor. Every relationship in input tolerance becomes output uncertainty through the derivative is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: A small measurement interval around x maps to an output interval around f(x). The local slope estimates how much the output uncertainty is amplified or reduced. Reading order: curve: output f(x)=x^2; solid line.; input-band: input tolerance 2±0.1; lower-output: lower output near 3.61; dashed segment.; upper-output: upper output near 4.41; 