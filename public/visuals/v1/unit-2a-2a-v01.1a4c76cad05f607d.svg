<svg aria-labelledby="bvlp-unit-2a-2a-v01-title bvlp-unit-2a-2a-v01-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v01" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v01-title">What a derivative connects</title><desc id="bvlp-unit-2a-2a-v01-description">A derivative ties together four descriptions of the same local behavior: a changing quantity, an average rate on a short interval, the limiting instantaneous rate, and the slope of a tangent line. Begin at the upper-left box. A function gives an amount. Comparing two nearby amounts produces an average rate. Letting the input interval shrink produces the derivative. The derivative is also the slope of the tangent line, so the diagram closes by returning to the original graph. The arrows do not describe four unrelated formulas; they describe four ways to talk about one local change. A derivative ties together four descriptions of the same local behavior: a changing quantity, an average rate on a short interval, the limiting instantaneous rate, and the slope of a tangent line. Begin at the upper-left box. A function gives an amount. Comparing two nearby amounts produces an average rate. Letting the input interval shrink produces the derivative. The derivative is also the slope of the tangent line, so the diagram closes by returning to the original graph. The arrows do not describe four unrelated formulas; they describe four ways to talk about one local change. The visual uses labeled positions, solid and dashed line styles, and written descriptions so what a derivative connects does not depend on color. Caption: A derivative ties together four descriptions of the same local behavior: a changing quantity, an average rate on a short interval, the limiting instantaneous rate, and the slope of a tangent line. Reading order: quantity-box: Labeled box: Original quantity: f(x).; average-box: Labeled box: Average rate: change in f / change in x.; tangent-box: Labeled box: Tangent slope: local line.; instant-box: Labeled box: Instantaneous rate: f&apos;(x).; compare-arrow: compare nearby inputs.; shrink-arrow: shrink the interval.; interpret-arrow: interpret geometrically.; return-arrow: read from the graph.; quantity-label: Written label identifies Original quantity: f(x).; average-label: Written label identifies Average rate: change in f / change in x.; tangent-label: Written label identifies Tangent slope: local line.; instant-label: Written label identifies Instantaneous rate: f&apos;(x).; compare-label: Arrow label: compare nearby inputs.; shrink-label: Arrow label: shrink the interval.; interpret-label: Arrow label: interpret geometrically.; return-label: Arrow label: read from the graph..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v01-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v01-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-