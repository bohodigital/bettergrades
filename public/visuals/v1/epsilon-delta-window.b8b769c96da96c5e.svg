<svg aria-labelledby="bvlp-epsilon-delta-window-title bvlp-epsilon-delta-window-description" class="bvlp-svg" data-bvlp-scene="epsilon-delta-window" data-grayscale-safe="true" focusable="false" height="582" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 582" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-epsilon-delta-window-title">An epsilon band and delta window</title><desc id="bvlp-epsilon-delta-window-description">Changing epsilon changes a centered output band and the largest symmetric input window that keeps nearby outputs inside it. The curve f(x) = x squared divided by 2 plus 1 passes through (a, L) = (2, 3). A horizontally patterned band extends from 3 - epsilon to 3 + epsilon. A vertically patterned window is bounded by 4 - square root of (4 + 2 epsilon) and square root of (4 + 2 epsilon). With epsilon 0.75, the largest symmetric delta is about 0.3452, and nearby curve points inside that punctured window remain in the output band. The epsilon band has diagonal hatching and dashed horizontal boundaries. The delta window has crosshatching and dotted vertical boundaries. The limit point is a filled diamond. Caption: An epsilon band around L and a corresponding delta window around a. A valid delta keeps the nearby graph inside the band. Reading order: epsilon-function: Heavy solid nonlinear function curve.; epsilon-band: Diagonal-patterned horizontal epsilon band.; epsilon-lower: Dashed lower boundary of the epsilon band.; epsilon-upper: Dashed upper boundary of the epsilon band.; delta-window: Crosshatched vertical delta window.; delta-left: Dotted left boundary of the delta window.; delta-right: Dotted right boundary of the delta window.; limit-point: Filled diamond identifies the limit target (2, 3).; epsilon-delta-note: Text states the epsilon-delta implication.; epsilon-control: Epsilon.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-epsilon-delta-window-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-epsilon-delta-window-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-epsilon-delta-window-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-epsilon-delta-window-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-epsilon-delta-window-panel-default-clip"><rect height="460" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-epsilon-delta-window-panel-default-title bvlp-epsilon-delta-window-panel-default-desc" id="bvlp-epsilon-delta-window-panel-default" role="group"><title id="bvlp-epsilon-delta-window-panel-default-title">An epsilon band and delta window</title><desc id="bvlp-epsilon-delta-window-panel-default-desc">Changing epsilon changes a centered output band and the largest symmetric input window that keeps nearby outputs inside it.</desc><rect class="bvlp-panel-bg" fill="#ffffff" height="460" stroke="#cbd5e1" stroke-width="1" width="830" x="84" y="46"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="84" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="167" x2="167" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="250" x2="250" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="333" x2="333" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="416" x2="416" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="499" x2="499" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="582" x2="582" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="665" x2="665" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="748" x2="748" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="831" x2="831" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="914" x2="914" y1="46" y2="506"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="914" y1="480.444" y2="480.444"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="914" y1="378.222" y2="378.222"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="914" y1="276" y2="276"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="914" y1="173.778" y2="173.778"/><line stroke="#e2e8f0" stroke-width="1" x1="84" x2="914" y1="71.556" y2="71.556"/><line stroke="#334155" stroke-width="1.5" x1="84" x2="914" y1="480.444" y2="480.444"/><line stroke="#334155" stroke-width="1" x1="84" x2="84" y1="476.444" y2="484.444"/><text fill="#111827" font-size="11" text-anchor="middle" x="84" y="526"><tspan dy="0" x="84">-0.5</tspan></text><line stroke="#334155" stroke-width="1" x1="167" x2="167" y1="476.444" y2="484.444"/><text fill="#111827" font-size="11" text-anchor="middle" x="167" y="526"><tspan dy="0" x="167">0</tspan></text><line stroke="#334155" stroke-width="1" x1="250" x2="250" y1="476.444" y2="484.444"/><text fill="#111827" font-size="11" text-anchor="middle" x="