pan dy="0" x="76">0</tspan></text><line stroke="#334155" stroke-width="1" x1="163" x2="171" y1="378.222" y2="378.222"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="382.222"><tspan dy="0" x="76">2</tspan></text><line stroke="#334155" stroke-width="1" x1="163" x2="171" y1="276" y2="276"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="280"><tspan dy="0" x="76">4</tspan></text><line stroke="#334155" stroke-width="1" x1="163" x2="171" y1="173.778" y2="173.778"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="177.778"><tspan dy="0" x="76">6</tspan></text><line stroke="#334155" stroke-width="1" x1="163" x2="171" y1="71.556" y2="71.556"/><text fill="#111827" font-size="11" text-anchor="end" x="76" y="75.556"><tspan dy="0" x="76">8</tspan></text><text class="bvlp-axis-label" fill="#111827" font-size="13" text-anchor="start" x="84" y="39"><tspan dy="0" x="84">f(x)</tspan></text><g clip-path="url(#bvlp-epsilon-delta-window-panel-default-clip)"><g aria-label="Dotted left boundary of the delta window." data-layer-id="delta-left" data-layer-kind="line" data-line-style="dotted" role="group"><line fill="none" stroke="#15803d" stroke-dasharray="2 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="441.695" x2="441.695" y1="506" y2="46"/><text class="bvlp-annotation" data-bvlp-label-box="452.695,54,72.03,15.34" fill="#111827" font-size="13" text-anchor="start" x="452.695" y="67"><tspan dy="0" x="452.695">a - delta</tspan></text></g><g aria-label="Dotted right boundary of the delta window." data-layer-id="delta-right" data-layer-kind="line" data-line-style="dotted" role="group"><line fill="none" stroke="#15803d" stroke-dasharray="2 6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="556.305" x2="556.305" y1="506" y2="46"/><text class="bvlp-annotation" data-bvlp-label-box="567.305,54,72.03,15.34" fill="#111827" font-size="13" text-anchor="start" x="567.305" y="67"><tspan dy="0" x="567.305">a + delta</tspan></text></g><g aria-label="Crosshatched vertical delta window." data-layer-id="delta-window" data-layer-kind="region" data-line-style="solid" role="group"><rect fill="url(#bvlp-epsilon-delta-window-pattern-crosshatch)" fill-opacity="0.48" height="460" stroke="none" width="114.609" x="441.695" y="46"/></g><g aria-label="Diagonal-patterned horizontal epsilon band." data-layer-id="epsilon-band" data-layer-kind="region" data-line-style="solid" role="group"><rect fill="url(#bvlp-epsilon-delta-window-pattern-diagonal)" fill-opacity="0.48" height="76.667" stroke="none" width="830" x="84" y="288.778"/></g><g aria-label="Text states the epsilon-delta implication." data-layer-id="epsilon-delta-note" data-layer-kind="annotation" data-line-style="solid" role="group"><line stroke="#111827" stroke-opacity="0.55" stroke-width="1" x1="590.3" x2="601.3" y1="102.222" y2="112.222"/><circle cx="590.3" cy="102.222" fill="#111827" r="2.5"/><text class="bvlp-annotation" data-bvlp-label-box="601.3,112.222,294.46,30.68" fill="#111827" font-size="13" text-anchor="start" x="601.3" y="125.222"><tspan dy="0" x="601.3">0 &lt; |x - a| &lt; delta implies |f(x) - L|</tspan><tspan dy="1.18em" x="601.3">&lt; epsilon</tspan></text></g><g aria-label="Heavy solid nonlinear function curve." data-layer-id="epsilon-function" data-layer-kind="function" data-line-style="solid" role="group"><path d="M117.2,427.033L154.55,429.19L191.9,428.758L229.25,425.74L266.6,420.133L303.95,411.94L341.3,401.158L378.65,387.79L416,371.833L453.35,353.29L490.7,332.158L528.05,308.44L565.4,282.133L602.75,253.24L640.1,221.758L677.45,187.69L714.8,151.033L752.15,111.79L789.5,69.958L809.646,46" data-segment-index="0" fill="none" stroke="#155e75" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke"/></g><g aria-label="Dashed lower boundary of the epsilon band." data-layer-id="epsilon-lower" data-layer-kind="line" data-line-style="dashed" role="group"><line fill="none" stroke="#b45309" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="84" x2="914" y1="365.444" y2="365.444"/><text class="bvlp-annotation" data-bvlp-label-box="818.63,341.104,87.37,15.34" fill="#111827" font-size="13" text-anchor="start" x="818.63" y="354.104"><tspan dy="0" x="818.63">L - epsilon</tspan></text></g><g aria-label="Dashed upper boundary of the epsilon band." data-layer-id="epsilon-upper" data-layer-kind="line" data-line-style="dashed" role="group"><line fill="none" stroke="#b45309" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" vector-effect="non-scaling-stroke" x1="84" x2="914" y1="288.778" y2="288.778"/><text class="bvlp-annotation" data-bvlp-label-box="818.63,264.438,87.37,15.34" fill="#111827" font-size="13" text-anchor="start" x="818.63" y="277.438"><tspan dy="0" x="818.63">L + epsilon</tspan></text></g><g aria-label="Filled diamond identifies the limit target (2, 3)." data-layer-id="limit-point" data-layer-kind="closed-point" data-line-style="solid" role="group"><polygon fill="#cbd5e1" points="499,320.111 506,327.111 499,334.111 492,327.111" stroke="#111827" stroke-width="2.25" vector-effect="non-scaling-stroke"/><text class="bvlp-annotation" data-bvlp-label-box="510,302.771,118.05,15.34" fill="#111827" font-size="13" text-anchor="start" x="510" y="315.771"><tspan dy="0" x="510">(a, L) = (2, 3)</tspan></text></g></g></g></svg>
