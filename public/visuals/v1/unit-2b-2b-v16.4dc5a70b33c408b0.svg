<svg aria-labelledby="bvlp-unit-2b-2b-v16-title bvlp-unit-2b-2b-v16-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v16" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v16-title">Concavity describes how slopes change</title><desc id="bvlp-unit-2b-2b-v16-description">On a concave-up curve, tangent slopes increase and tangent lines lie locally below the graph. On a concave-down curve, slopes decrease and tangents lie locally above. In the left panel, tangent slopes progress from negative to zero to positive, so they are increasing and f&quot;&gt;0 . In the right panel, slopes progress from positive to zero to negative, so they are decreasing and f&quot;&lt;0 . Concavity is about the trend of slopes, not whether the function itself is above or below the axis. In the left panel, tangent slopes progress from negative to zero to positive, so they are increasing and f&quot;&gt;0. In the right panel, slopes progress from positive to zero to negative, so they are decreasing and f&quot;&lt;0. Concavity is about the trend of slopes, not whether the function itself is above or below the axis. On a concave-up curve, tangent slopes increase and tangent lines lie locally below the graph. On a concave-down curve, slopes decrease and tangents lie locally above. In the left panel, tangent slopes progress from negative to zero to positive, so they are increasing and f&quot;&gt;0 . In the right panel, slopes progress from positive to zero to negative, so they are decreasing and f&quot;&lt;0 . Concavity is about the trend of slopes, not whether the function itself is above or below the axis. Every relationship in concavity describes how slopes change is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: On a concave-up curve, tangent slopes increase and tangent lines lie locally below the graph. On a concave-down curve, slopes decrease and tangents lie locally above. Reading order: up: concave up: slopes increase; solid line.; down: concave down: slopes decrease; solid line.; up-tangent-one: negative tangent slope; dashed segment.; up-tangent-two: positive tangent slope; dashed segment.; down-tangent-one: positive tangent slope; dashed segment.; down-tangent-two: negative tangent slope; dashed segment.; up-note: Annotation: f&apos;&apos; &gt; 0.; down-note: Annotation: f&apos;&apos; &lt; 0..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v16-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v16-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v16-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v16-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" or