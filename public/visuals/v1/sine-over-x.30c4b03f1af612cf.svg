<svg aria-labelledby="bvlp-sine-over-x-title bvlp-sine-over-x-description" class="bvlp-svg" data-bvlp-scene="sine-over-x" data-grayscale-safe="true" focusable="false" height="533" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 533" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-sine-over-x-title">The sine-over-x limit</title><desc id="bvlp-sine-over-x-description">Separate left and right branches approach 1 at zero even though the formula is undefined there. The even function y = sin(x) divided by x is drawn from approximately negative 2 pi to 2 pi in two explicit branches that stop at zero. An open circle at (0, 1) marks the missing formula value. A dashed horizontal guide marks y = 1, and both branches approach that guide as x approaches zero. The two solid branches stop at an open circle, and a dashed horizontal guide with text marks y = 1. Caption: The graph of sin(x)/x has a removable hole at (0, 1) and approaches 1 from both sides. Reading order: sinc-left: Solid negative-domain branch stops before zero.; sinc-right: Solid positive-domain branch starts after zero.; limit-guide: Dashed horizontal guide marks the approached height 1.; hole-at-one: Open circle marks the missing point at (0, 1).; sinc-note: Text identifies the common one-sided limit..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-sine-over-x-pattern-diagonal" patternUnits="u