<svg aria-labelledby="bvlp-unit-2b-2b-v29-title bvlp-unit-2b-2b-v29-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v29" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v29-title">For a convex function, a stationary point is automatically global</title><desc id="bvlp-unit-2b-2b-v29-description">A convex graph lies above each tangent line. When the tangent slope is zero, that horizontal line supports the entire graph from below, so no other point can have a smaller function value. The horizontal green line touches the curve at the stationary point and stays below the graph everywhere shown. Convexity turns the local derivative statement f&apos;(x *)=0 into the global conclusion f(x) f(x *) for every point in the interval. The horizontal green line touches the curve at the stationary point and stays below the graph everywhere shown. Convexity turns the local derivative statement f&apos;(x *)=0 into the global conclusion f(x) f(x *) for every point in the interval. A convex graph lies above each tangent line. When the tangent slope is zero, that horizontal line supports the entire graph from below, so no other point can have a smaller function value. The horizontal green line touches the curve at the stationary point and stays below the graph everywhere shown. Convexity turns the local derivative statement f&apos;(x *)=0 into the global conclusion f(x) f(x *) for every point in the interval. Every relationship in for a convex function, a stationary point is automatically global is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: A convex graph lies above each tangent line. When the tangent slope is zero, that horizontal line supports the entire g