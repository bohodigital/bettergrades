<svg aria-labelledby="bvlp-unit-2a-2a-v15-title bvlp-unit-2a-2a-v15-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v15" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v15-title">Composition is a two-stage function machine</title><desc id="bvlp-unit-2a-2a-v15-description">The inner function changes x into u=g(x) . The outer function changes u into y=f(u) . The chain rule multiplies the local rate of the second stage by the local rate of the first. A change in x first creates a change in the inner quantity u . That inner change then creates a change in the final output y . The overall response is the product of the two local conversion rates. The outer derivative must be evaluated at the actual inner output u=g(x) . The inner function changes x into u=g(x) . The outer function changes u into y=f(u) . The chain rule multiplies the local rate of the second stage by the local rate of the first. A change in x first creates a change in the inner quantity u . That inner change then creates a change in the final output y . The overall response is the product of the two local conversion rates. The outer derivative must be evaluated at the actual inner output u=g(x) . The visual uses labeled positions, solid and dashed line styles, and written descriptions so composition is a two-stage function machine does not depend on color. Caption: The inner function changes x into u=g(x). The outer function changes u into y=f(u). The chain rule multiplies the local rate of the second stage by the local rate of the first. Reading order: input-box: Labeled box: input x.; inner-box: Labeled box: inner machine: u = g(x).; outer-box: Labeled box: outer machine: y = f(u).; inner-rate-arrow: du / dx.; outer-rate-arrow: dy / du.; input-label: Written label identifies input 