<svg aria-labelledby="bvlp-unit-2a-2a-v07-title bvlp-unit-2a-2a-v07-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v07" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v07-title">Continuity does not guarantee a derivative</title><desc id="bvlp-unit-2a-2a-v07-description">All four graphs are continuous at the marked point. Only the smooth graph has one finite limiting slope; the corner, cusp, and vertical tangent fail for different reasons. The graph can remain unbroken and still fail to have an ordinary derivative. At a corner, the finite one-sided slopes disagree. At a cusp, the slopes diverge with opposite signs. At a vertical tangent, the slopes become unbounded with the same overall vertical direction. Continuity asks whether the graph joins; differentiability asks whether it has one finite local direction. All four graphs are continuous at the marked point. Only the smooth graph has one finite limiting slope; the corner, cusp, and vertical tangent fail for different reasons. The graph can remain unbroken and still fail to have an ordinary derivative. At a corner, the finite one-sided slopes disagree. At a cusp, the slopes diverge with opposite signs. At a vertical tangent, the slopes become unbounded with the same overall vertical direction. Continuity asks whether the graph joins; differentiability asks whether it has one finite local direction. The visual uses labeled positions, solid and dashed line styles, and written descriptions so continuity does not guarantee a derivative does not depend on color. Caption: All four graphs are continuous at the marked point. Only the smooth graph has one finite limiting slope; the corner, cusp, and vertical tangent fail for different reasons. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; relationship-3: dotted curve 3 is distinguished by line style and label.; relationship-4: solid curve 4 is distinguished by line style and label.; origin: Filled circle marks marked input x = 0..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v07-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v07-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v07-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2a-2a-v07-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2a-2a-v07-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2a-2a-v07-panel-default-title bvlp-unit-2a-2a-v07-panel-defaul