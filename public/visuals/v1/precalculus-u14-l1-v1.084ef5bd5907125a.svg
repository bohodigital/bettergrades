<svg aria-labelledby="bvlp-precalculus-u14-l1-v1-title bvlp-precalculus-u14-l1-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u14-l1-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u14-l1-v1-title">Parametric equations and orientation · Parametric tracer with directed point sequence</title><desc id="bvlp-precalculus-u14-l1-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: A table of t-values reveals ordered positions. Arrows on the curve preserve orientation information that is absent from an ordinary Cartesian equation. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: A table of t-values reveals ordered positions. Arrows on the curve preserve orientation information that is absent from an ordinary Cartesian equation. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: A table of t-values reveals ordered positions. Arrows on the curve preserve orientation information that is absent from an ordinary Cartesian equation. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Reading order: restricted-parabola: x=2t-1, y=t^2 for -2&lt;=t&lt;=3; solid curve.; start: Filled square marks Included start point (-5,4) at t=-2..; vertex: Filled diamond marks Vertex (-1,0) at t=0..; end: Filled circle marks Included end point (5,9) at t=3..; direction-left: As t increases, the point moves right toward the vertex.; direction-right: As t continues increasing, the point moves right toward (5,9).; relation: Label: y=(x+1)^2/4 with -5&lt;=x&lt;=5; trace left to right...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-precalculus-u14-l1-v1-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-precalculus-u14-l1-v1-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-precalculus-u14-l1-v1-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-precalculus-u14-l1-v1-arrow" markerHeight="7" markerUnits="strokeWidth" marke