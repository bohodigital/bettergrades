<svg aria-labelledby="bvlp-secant-tangent-title bvlp-secant-tangent-description" class="bvlp-svg" data-bvlp-scene="secant-tangent" data-grayscale-safe="true" focusable="false" height="533" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 533" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-secant-tangent-title">Secant lines approach a tangent line</title><desc id="bvlp-secant-tangent-description">P stays fixed while nonzero h moves Q and changes the secant slope toward 32 feet per second. A position curve s(t) = 64t - 16t squared is shown from 0 to 4 seconds. P is fixed at t = 1 second and s = 48 feet. Three secant states through P have slopes 16, 24, and 28.8 feet per second. The active secant can use positive or negative nonzero h and rotates toward the tangent line, whose slope is 32 feet per second. The position curve is heavy and solid, reference secants are dotted and dashed, the active secant is heavy, and the tangent is double-stroked. P is a circle and Q is a diamond. Caption: Secant lines through P = (1, 48) approach the tangent line as the second point moves toward P. Reading order: position-curve: Heavy solid position curve.; point-p: Filled circle labeled P at (1, 48).; secant-h-one: Dotted reference secant for h = 1.; secant-h-half: Dashed reference secant for h = 0.5.; active-secant: Heavy active secant controlled by the nonzero h step control.; point-q: Filled diamond labeled Q distinguishes the movable point from P.; tangent-line: Double-stroked tangent line through P.; slope-note: Text annotation states both slope formulas.; h-control: Horizontal change h.</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg 