<svg aria-labelledby="bvlp-unit-2a-2a-v22-title bvlp-unit-2a-2a-v22-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v22" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v22-title">The nonlinear remainder shrinks faster than the input step</title><desc id="bvlp-unit-2a-2a-v22-description">For f(x)=x 2 at a=3 , the exact change is 6h+h 2 . The tangent model keeps 6h ; the discarded remainder h 2 becomes small not only in absolute size, but also relative to h . Near h=0 , the gold curve falls toward zero much faster than the blue V-shaped graph. Dividing the remainder by the step gives h 2/|h|=|h| , which also approaches zero. That relative comparison, rather than the mere fact that both quantities are small, is what little- o notation records. For f(x)=x 2 at a=3 , the exact change is 6h+h 2 . The tangent model keeps 6h ; the discarded remainder h 2 becomes small not only in absolute size, but also relative to h . Near h=0 , the gold curve falls toward zero much faster than the blue V-shaped graph. Dividing the remainder by the step gives h 2/|h|=|h| , which also approaches zero. That relative comparison, rather than the mere fact that both quantities are small, is what little- o notation records. The visual uses labeled positions, solid and dashed line styles, and written descriptions so the nonlinear remainder shrinks faster than the input step does not depend on color. Caption: For f(x)=x² at a=3, the exact change is 6h+h². The tangent model keeps 6h; the discarded remainder h² becomes small not only in absolute size, but also relative to h. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; remainder-half: Filled circle marks h = 0.5.; remainder-quarter: Filled circle marks h = 0.25.; remainder-tenth: Filled circle marks h = 0.1..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2a-2a-v22-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2a-2a-v22-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2a-2a-v22-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2a-2a-v22-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2a-2a-v22-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2a-2a-v22-panel-default-title bvlp-unit-2a-2a-v22-panel-default-desc" id="bvlp-unit-2a-2a-v22-panel-default" role="group"><title id="bvlp-unit-2a-2a-v22-panel-default-title">The nonlinear remainder shrinks faster than the input step</title><desc id="bvlp-unit-2a-2