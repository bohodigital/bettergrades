<svg aria-labelledby="bvlp-unit-2b-2b-v20-title bvlp-unit-2b-2b-v20-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v20" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v20-title">Marginal quantities are slopes of total quantities</title><desc id="bvlp-unit-2b-2b-v20-description">Marginal cost and marginal revenue are derivative graphs. Profit increases where marginal revenue exceeds marginal cost and is stationary where they are equal. The left panel shows accumulated revenue and cost. The right panel shows their slopes. Before q=6 , marginal revenue exceeds marginal cost, so producing another unit increases profit. After q=6 , marginal cost is larger, so additional production reduces profit in this model. The left panel shows accumulated revenue and cost. The right panel shows their slopes. Before q=6, marginal revenue exceeds marginal cost, so producing another unit increases profit. After q=6, marginal cost is larger, so additional production reduces profit in this model. Marginal cost and marginal revenue are derivative graphs. Profit increases where marginal revenue exceeds marginal cost and is stationary where they are equal. The left panel shows accumulated revenue and cost. The right panel shows their slopes. Before q=6 , marginal revenue exceeds marginal cost, so producing another unit increases profit. After q=6 , marginal cost is larger, so additional production reduces profit in this model. Every relationship in marginal quantities are slopes of total quantities is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: Marginal cost and marginal revenue are derivative graphs. Profit increases where marginal revenue exceeds marginal cost and is stationary where they are equal. Reading order: revenue: R(q); solid line.; cost: C(q); dashed line.; marginal-revenue: MR(q)-12; solid line.; marginal-cost: MC(q)-12; dashed line.; quantity-guide: q=6: MR=MC; dotted segment.; decision: Annotation: Profit rises for MR&gt;MC; q=6 is the candidate...</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-unit-2b-2b-v20-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-unit-2b-2b-v20-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-unit-2b-2b-v20-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-unit-2b-2b-v20-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker></defs><defs><clipPath id="bvlp-unit-2b-2b-v20-panel-default-clip"><rect height="436" width="830" x="84" y="46"/></clipPath></defs><g aria-labelledby="bvlp-unit-2b-2b-v20-panel-default-title bvlp-unit-2b-2b-v20-pane