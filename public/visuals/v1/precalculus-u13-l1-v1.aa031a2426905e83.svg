<svg aria-labelledby="bvlp-precalculus-u13-l1-v1-title bvlp-precalculus-u13-l1-v1-description" class="bvlp-svg" data-bvlp-scene="precalculus-u13-l1-v1" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-precalculus-u13-l1-v1-title">Conics as loci and the circle foundation · Distance locus diagram</title><desc id="bvlp-precalculus-u13-l1-v1-description">Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Completing squares converts general quadratic expressions into center-radius form and reveals whether the relation is a circle, a point, or an empty set. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Completing squares converts general quadratic expressions into center-radius form and reveals whether the relation is a circle, a point, or an empty set. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. The figure uses concrete points, curves, arrows, intervals, or matrix structure instead of relying on color alone. Labels, point shapes, line styles, arrows, and position carry the mathematical meaning; color is supplementary. Caption: Follow the foundation example from its given information to the conclusion. The labels identify the mathematical feature that makes the result valid: Completing squares converts general quadratic expressions into center-radius form and reveals whether the relation is a circle, a point, or an empty set. The calculation and the representation should agree, so a graph, diagram, table, or substitution check should support the same conclusion. Reading order: circle: circle centered at (-2,3) with radius 5; solid curve.; center: Filled diamond marks Center (-2,3)..; x-left: Filled square marks x-intercept (-6,0)..; x-right: Filled circle marks x-intercept (2,0)..; y-low: Filled square marks lower y-intercept (0,3-sqrt(21))..; y-high: Filled circle marks upper y-intercept (0,3+sqrt(21))..; radius: Radius 5 from the center to (2,0).; equation: Label: (x+2)^2+(y-3)^2=25..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-label,.bvlp-svg .bvlp-panel-title{font-weight:700}.bvlp-svg .bvlp-annotation{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.bvlp-svg path,.bvlp-svg line,.bvlp-svg polyline,.bvlp-svg polygon,.bvlp-svg circle,.bvlp-svg ellipse{shape-rendering:geometricPrecision}@media print{.bvlp-svg{color-adjust:exact;print-color-adjust:exact}.bvlp-svg .bvlp-panel-bg{fill:#fff}.bvlp-svg text{fill:#000!important}}</style><defs><pattern height="10" id="bvlp-precalculus-u13-l1-v1-pattern-diagonal" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3" fill="none" stroke="#64748b" stroke-width="1.25"/></pattern><pattern height="10" id="bvlp-precalculus-u13-l1-v1-pattern-crosshatch" patternUnits="userSpaceOnUse" width="10"><rect fill="#f8fafc" height="10" width="10"/><path d="M-2 10L10-2M3 15L15 3M-2 0L10 12M3-5L15 7" fill="none" stroke="#64748b" stroke-width="1"/></pattern><pattern height="9" id="bvlp-precalculus-u13-l1-v1-pattern-dots" patternUnits="userSpaceOnUse" width="9"><rect fill="#f8fafc" height="9" width="9"/><circle cx="4.5" cy="4.5" fill="#64748b" r="1.35"/></pattern><marker id="bvlp-precalculus-u13-l1-v1-arrow" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 