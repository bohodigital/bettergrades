<svg aria-labelledby="bvlp-unit-2a-2a-v17-title bvlp-unit-2a-2a-v17-description" class="bvlp-svg" data-bvlp-scene="unit-2a-2a-v17" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2a-2a-v17-title">An implicit curve has local slopes even without one global formula y=f(x)</title><desc id="bvlp-unit-2a-2a-v17-description">The circle x 2+y 2=25 contains upper and lower branches. Implicit differentiation gives one slope formula, dy/dx=-x/y , valid wherever y 0 . The circle is not one function of x because most vertical lines meet it twice. Nevertheless, at the point (3,4) the curve has a definite tangent. Differentiating the relationship gives 2x+2y y&apos;=0 , so y&apos;=-x/y=-3/4 at that point. The circle x 2+y 2=25 contains upper and lower branches. Implicit differentiation gives one slope formula, dy/dx=-x/y , valid wherever y 0 . The circle is not one function of x because most vertical lines meet it twice. Nevertheless, at the point (3,4) the curve has a definite tangent. Differentiating the relationship gives 2x+2y y&apos;=0 , so y&apos;=-x/y=-3/4 at that point. The visual uses labeled positions, solid and dashed line styles, and written descriptions so an implicit curve has local slopes even without one global formula y=f(x) does not depend on color. Caption: The circle x 2+y 2=25 contains upper and lower branches. Implicit differentiation gives one slope formula, dy/dx=-x/y, valid wherever y 0. Reading order: relationship-1: solid curve 1 is distinguished by line style and label.; relationship-2: dashed curve 2 is distinguished by line style and label.; reading-note: A written reading cue names the visual&apos;s mathematical relationship..</desc><style>.bvlp-svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bvlp-svg .bvlp-axis-