<svg aria-labelledby="bvlp-unit-2b-2b-v06-title bvlp-unit-2b-2b-v06-description" class="bvlp-svg" data-bvlp-scene="unit-2b-2b-v06" data-grayscale-safe="true" focusable="false" height="558" preserveAspectRatio="xMidYMid meet" role="img" style="display:block;height:auto;max-width:100%;width:100%" viewBox="0 0 960 558" width="100%" xmlns="http://www.w3.org/2000/svg"><title id="bvlp-unit-2b-2b-v06-title">Differentials separate the actual change from the tangent-line estimate</title><desc id="bvlp-unit-2b-2b-v06-description">The curve produces the actual output change y . The tangent line produces the differential dy=f&apos;(x)dx . Their vertical gap is the approximation error. Starting at x=1 , the input changes by dx=0.7 . The tangent predicts dy=2(0.7)=1.4 , while the curve actually changes by y=1.89 . The two quantities are close only when the input change is sufficiently small; they are not identical by definition. Starting at x=1, the input changes by dx=0.7. The tangent predicts dy=2(0.7)=1.4, while the curve actually changes by y=1.89. The two quantities are close only when the input change is sufficiently small; they are not identical by definition. The curve produces the actual output change y . The tangent line produces the differential dy=f&apos;(x)dx . Their vertical gap is the approximation error. Starting at x=1 , the input changes by dx=0.7 . The tangent predicts dy=2(0.7)=1.4 , while the curve actually changes by y=1.89 . The two quantities are close only when the input change is sufficiently small; they are not identical by definition. Every relationship in differentials separate the actual change from the tangent-line estimate is identified with written labels plus distinct solid, dashed, dotted, double, marker, or pattern cues; color is never the only carrier of meaning. Caption: The curve produces the actual output change y. The tangent line produces the differential dy=f&apos;(x)dx. Their vertical gap is the approximation error. Reading order: curve