<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radius-interval-convergence-title radius-interval-convergence-desc" viewBox="0 0 1200 805" width="1200" height="805"><title id="radius-interval-convergence-title">Radius and interval of convergence</title><desc id="radius-interval-convergence-desc">Locate the center a. Use ratio or root test. Solve |x-a|&lt;R. Test the left endpoint. Test the right endpoint.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2c879"/></marker></defs><rect width="1200" height="805" fill="#101713"/><text x="600" y="72" text-anchor="middle" fill="#eaf3ee" font-family="Arial, sans-serif" font-size="42" font-weight="700">Radius and interval of convergence</text><g><rect x="120" y="135" width="960" height="82" rx="18" fill="#24584f" stroke="#8bd3c2" stroke-width="3"/><text x="165" y="186" fill="#ffffff" font-size="30" font-family="Arial, sans-serif" font-weight="700">1.</text><text x="220" y="186" fill="#ffffff" font-size="30" font-family="Arial, sans-serif">Locate the center a</text><path d="M600 217v43" stroke="#f2c879" stroke-width="6" marker-end="url(#arrow)"/></g><g><rect x="120" y="260" width="960" height="82" rx="18" fill="#173d38" stroke="#8bd3c2" stroke-width="3"/><text x="165" y="311" fill="#ffffff" font-size="30" font-family="Arial, sans-serif" font-weight="700">2.</text><text x="220" y="311" fill="#ffffff" font-size="30" font-family="Arial, sans-serif">Use ratio or root test</text><path d="M600 342v43" stroke="#f2c879" stroke-width="6" marker-end="url(#arrow)"/></g><g><rect x="120" y="385" width="960" height="82" rx="18" fill="#24584f" stroke="#8bd3c2" stroke-width="3"/><text x="165" y="436" fill="#ffffff" font-size="30" font-family="Arial, sans-serif" font-weight="700">3.</text><text x="220" y="436" fill="#ffffff" font-size="30" font-family="Arial, sans-serif">Solve |x-a|&lt;R</text><path d="M600 467v43" stroke="#f2c879" stroke-width="6" marker-end="url(#arrow)"/></g><g><rect x="120" y="510" width="960" height="82" rx="18" fill="#173d38" stroke="#8bd3c2" stroke-width="3"/><text x="165" y="561" fill="#ffffff" font-size="30" font-family="Arial, sans-serif" font-weight="700">4.</text><text x="220" y="561" fill="#ffffff" font-size="30" font-family="Arial, sans-serif">Test the left endpoint</text><path d="M600 592v43" stroke="#f2c879" stroke-width="6" marker-end="url(#arrow)"/></g><g><rect x="120" y="635" width="960" height="82" rx="18" fill="#24584f" stroke="#8bd3c2" stroke-width="3"/><text x="165" y="686" fill="#ffffff" font-size="30" font-family="Arial, sans-serif" font-weight="700">5.</text><text x="220" y="686" fill="#ffffff" font-size="30" font-family="Arial, sans-serif">Test the right endpoint</text></g><text x="600" y="781" text-anchor="middle" fill="#a8bbb2" font-family="Arial, sans-serif" font-size="20">BetterGrades · 2026-07-23</text></svg>
